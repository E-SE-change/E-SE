<style>
/* =========================================================
   E SE? — DESIGN SYSTEM
   ========================================================= */

:root{
  --bg:#08090d;
  --bg2:#0d0f16;
  --panel:#11141d;
  --panel2:#151923;
  --panel3:#1a1f2c;
  --text:#f5f5f7;
  --muted:#9ba1b0;
  --soft:#c8ccd6;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.14);
  --white:#fff;
  --green:#71e6a4;
  --blue:#79a9ff;
  --purple:#b992ff;
  --gold:#f5cf72;
  --red:#ff7f8e;
  --cyan:#67dce8;
  --shadow:0 24px 80px rgba(0,0,0,.38);
  --radius:24px;
  --radius-sm:16px;
  --max:1180px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 15% 0%,rgba(121,169,255,.09),transparent 30%),
    radial-gradient(circle at 85% 10%,rgba(185,146,255,.08),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  line-height:1.55;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

::selection{
  background:rgba(185,146,255,.3);
}

.container{
  width:min(calc(100% - 32px),var(--max));
  margin:0 auto;
}

/* =========================================================
   HEADER
   ========================================================= */

.site-header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  background:rgba(8,9,13,.76);
  border-bottom:1px solid var(--line);
}

.header-inner{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:800;
  letter-spacing:-.04em;
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(135deg,
      rgba(121,169,255,.25),
      rgba(185,146,255,.22));
  border:1px solid var(--line2);
  box-shadow:0 8px 30px rgba(121,169,255,.08);
}

.brand-name{
  font-size:18px;
}

.brand-sub{
  font-size:11px;
  color:var(--muted);
  font-weight:500;
  letter-spacing:0;
}

.nav{
  display:flex;
  align-items:center;
  gap:5px;
}

.nav button{
  background:none;
  border:0;
  color:var(--muted);
  padding:9px 11px;
  border-radius:10px;
  transition:.2s ease;
}

.nav button:hover{
  background:rgba(255,255,255,.05);
  color:var(--text);
}

.mobile-menu{
  display:none;
}

/* =========================================================
   GENERAL
   ========================================================= */

.page{
  min-height:calc(100vh - 72px);
}

.section{
  padding:90px 0;
}

.section-sm{
  padding:55px 0;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--soft);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-weight:800;
}

.eyebrow-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--purple);
  box-shadow:0 0 16px rgba(185,146,255,.65);
}

h1,h2,h3,h4{
  line-height:1.08;
  letter-spacing:-.045em;
  margin:0;
}

h1{
  font-size:clamp(48px,8vw,92px);
}

h2{
  font-size:clamp(34px,5vw,58px);
}

h3{
  font-size:25px;
}

p{
  margin:0;
}

.muted{
  color:var(--muted);
}

.soft{
  color:var(--soft);
}

.gradient-text{
  background:linear-gradient(100deg,#fff 5%,#b9caff 45%,#d7b8ff 95%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.btn-row{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}

.btn{
  min-height:50px;
  padding:0 20px;
  border-radius:14px;
  border:1px solid var(--line2);
  color:var(--text);
  background:rgba(255,255,255,.05);
  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-weight:750;
}

.btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.22);
}

.btn-primary{
  background:#fff;
  color:#090a0e;
  border-color:#fff;
}

.btn-primary:hover{
  background:#f2f2f5;
}

.btn-green{
  background:rgba(113,230,164,.12);
  border-color:rgba(113,230,164,.27);
  color:#a4f2c5;
}

.btn-blue{
  background:rgba(121,169,255,.12);
  border-color:rgba(121,169,255,.27);
  color:#b7d0ff;
}

.btn-purple{
  background:rgba(185,146,255,.12);
  border-color:rgba(185,146,255,.27);
  color:#d5baff;
}

.btn-danger{
  color:#ffadb6;
  background:rgba(255,127,142,.08);
  border-color:rgba(255,127,142,.2);
}

.card{
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018));
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.glass{
  background:rgba(17,20,29,.72);
  border:1px solid var(--line);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.hidden{
  display:none !important;
}

/* =========================================================
   HOME HERO
   ========================================================= */

.hero{
  min-height:calc(100vh - 72px);
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:560px;
  height:560px;
  border-radius:50%;
  background:rgba(121,169,255,.07);
  filter:blur(80px);
  top:-260px;
  left:-180px;
  pointer-events:none;
}

.hero::after{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  background:rgba(185,146,255,.065);
  filter:blur(90px);
  right:-180px;
  bottom:-230px;
  pointer-events:none;
}

.hero-grid{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:70px;
  align-items:center;
}

.hero-copy{
  padding:50px 0;
}

.hero-title{
  margin-top:20px;
  max-width:850px;
}

.hero-lead{
  margin-top:28px;
  max-width:650px;
  color:var(--soft);
  font-size:clamp(17px,2vw,21px);
  line-height:1.65;
}

.hero-actions{
  margin-top:34px;
}

.hero-note{
  margin-top:20px;
  font-size:12px;
  color:var(--muted);
}

.hero-orbit{
  min-height:480px;
  display:grid;
  place-items:center;
  position:relative;
}

.orbit{
  width:min(430px,82vw);
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.09);
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center;
  box-shadow:
    0 0 100px rgba(121,169,255,.07),
    inset 0 0 80px rgba(185,146,255,.03);
}

.orbit::before,
.orbit::after{
  content:"";
  position:absolute;
  inset:12%;
  border:1px solid rgba(255,255,255,.055);
  border-radius:50%;
}

.orbit::after{
  inset:25%;
}

.orbit-center{
  width:135px;
  height:135px;
  border-radius:38px;
  display:grid;
  place-items:center;
  text-align:center;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.11),
      rgba(255,255,255,.035));
  border:1px solid var(--line2);
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.orbit-center strong{
  font-size:25px;
  letter-spacing:-.06em;
}

.orbit-center span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.orbit-card{
  position:absolute;
  width:150px;
  padding:14px;
  border-radius:18px;
  background:rgba(17,20,29,.86);
  border:1px solid var(--line);
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.orbit-card strong{
  display:block;
  font-size:14px;
}

.orbit-card span{
  color:var(--muted);
  font-size:11px;
}

.orbit-one{top:3%;left:8%}
.orbit-two{right:0;top:38%}
.orbit-three{bottom:4%;left:18%}

.scroll-hint{
  margin-top:45px;
  color:var(--muted);
  font-size:12px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* =========================================================
   HOME EXPERIENCE CARDS
   ========================================================= */

.experience-header{
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:end;
  margin-bottom:32px;
}

.experience-header p{
  max-width:460px;
  color:var(--muted);
}

.experience-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.experience-card{
  position:relative;
  overflow:hidden;
  padding:30px;
  min-height:380px;
  display:flex;
  flex-direction:column;
  transition:.25s ease;
}

.experience-card:hover{
  transform:translateY(-6px);
  border-color:rgba(255,255,255,.18);
}

.experience-card::before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  filter:blur(55px);
  opacity:.22;
  right:-90px;
  top:-100px;
}

.experience-card.solo::before{background:var(--green)}
.experience-card.pair::before{background:var(--blue)}
.experience-card.now::before{background:var(--purple)}

.exp-number{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.15em;
  font-weight:800;
}

.exp-icon{
  width:52px;
  height:52px;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:23px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  margin:28px 0 22px;
}

.experience-card h3{
  font-size:30px;
}

.exp-subtitle{
  margin-top:9px;
  color:var(--soft);
  font-weight:650;
}

.exp-description{
  margin-top:18px;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}

.exp-bottom{
  margin-top:auto;
  padding-top:30px;
}

/* =========================================================
   HOME PHILOSOPHY
   ========================================================= */

.two-col{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:70px;
  align-items:start;
}

.section-intro p{
  margin-top:20px;
  color:var(--muted);
  max-width:500px;
}

.principles{
  display:grid;
  gap:14px;
}

.principle{
  padding:22px;
  display:grid;
  grid-template-columns:50px 1fr;
  gap:17px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(255,255,255,.025);
}

.principle-icon{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:rgba(255,255,255,.055);
}

.principle h4{
  font-size:17px;
  letter-spacing:-.02em;
}

.principle p{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}

/* =========================================================
   THREE PATHS
   ========================================================= */

.path-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:35px;
}

.path-card{
  padding:27px;
  min-height:260px;
  position:relative;
  overflow:hidden;
}

.path-card.green{border-color:rgba(113,230,164,.16)}
.path-card.blue{border-color:rgba(121,169,255,.16)}
.path-card.purple{border-color:rgba(185,146,255,.16)}

.path-badge{
  display:inline-flex;
  padding:7px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
  background:rgba(255,255,255,.05);
}

.path-card h3{
  margin-top:30px;
}

.path-card p{
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
}

/* =========================================================
   HOW
   ========================================================= */

.steps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  margin-top:38px;
}

.step{
  position:relative;
  padding:10px 22px 10px 0;
}

.step:not(:last-child)::after{
  content:"";
  position:absolute;
  top:23px;
  right:15px;
  width:30px;
  height:1px;
  background:var(--line2);
}

.step-number{
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  font-weight:800;
  font-size:13px;
}

.step h4{
  margin-top:18px;
}

.step p{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}

/* =========================================================
   REALITY
   ========================================================= */

.reality-banner{
  padding:50px;
  border-radius:30px;
  border:1px solid var(--line);
  background:
    radial-gradient(circle at 10% 0%,rgba(113,230,164,.08),transparent 35%),
    radial-gradient(circle at 90% 100%,rgba(185,146,255,.08),transparent 35%),
    rgba(255,255,255,.025);
}

.reality-banner p{
  max-width:720px;
  margin-top:18px;
  color:var(--muted);
}

.status-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:28px;
}

.status-pill{
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  padding:9px 12px;
  border-radius:999px;
  font-size:12px;
}

/* =========================================================
   EXAMPLES
   ========================================================= */

.examples-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:35px;
}

.example{
  padding:22px 24px;
  border:1px solid var(--line);
  border-radius:18px;
  color:var(--soft);
  background:rgba(255,255,255,.025);
  font-size:16px;
}

/* =========================================================
   FOOTER
   ========================================================= */

footer{
  border-top:1px solid var(--line);
  padding:40px 0 50px;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:25px;
  align-items:start;
}

.footer-links{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.footer-links button{
  background:none;
  border:0;
  color:var(--muted);
  padding:4px 0;
}

.footer-links button:hover{
  color:var(--text);
}

/* =========================================================
   APP SCREENS
   ========================================================= */

.app-shell{
  padding:50px 0 90px;
}

.app-header{
  max-width:850px;
}

.app-header h1{
  font-size:clamp(38px,6vw,62px);
  margin-top:14px;
}

.app-header p{
  margin-top:18px;
  color:var(--muted);
  max-width:720px;
}

.app-panel{
  margin-top:30px;
  padding:30px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  color:var(--soft);
  font-weight:700;
  font-size:13px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0c0f16;
  color:var(--text);
  padding:14px 15px;
  outline:none;
  transition:.2s;
}

textarea{
  min-height:145px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:rgba(185,146,255,.55);
  box-shadow:0 0 0 3px rgba(185,146,255,.08);
}

.field-hint{
  font-size:11px;
  color:var(--muted);
}

.question-list{
  display:grid;
  gap:17px;
  margin-top:25px;
}

.question-card{
  padding:22px;
  border:1px solid var(--line);
  border-radius:19px;
  background:rgba(255,255,255,.025);
}

.question-number{
  font-size:11px;
  color:var(--purple);
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.question-card h3{
  margin-top:9px;
  font-size:20px;
  letter-spacing:-.025em;
}

.question-card textarea,
.question-card input{
  margin-top:15px;
}

/* =========================================================
   NARRATIVE
   ========================================================= */

.narrative-header{
  display:flex;
  justify-content:space-between;
  gap:25px;
  align-items:start;
  flex-wrap:wrap;
}

.narrative-meta{
  color:var(--muted);
  font-size:12px;
}

.notice{
  margin-top:22px;
  padding:14px 17px;
  border-radius:15px;
  border:1px solid rgba(245,207,114,.15);
  background:rgba(245,207,114,.045);
  color:#d8ca9f;
  font-size:12px;
}

.life-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:28px;
}

.life-tab{
  border:1px solid var(--line);
  border-radius:17px;
  padding:18px;
  background:rgba(255,255,255,.025);
  text-align:left;
  color:var(--soft);
}

.life-tab.active{
  background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.2);
}

.life-tab strong{
  display:block;
  color:var(--text);
}

.life-tab span{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.timeline{
  margin-top:24px;
  display:grid;
  gap:16px;
}

.timeline-item{
  position:relative;
  padding:23px 23px 23px 27px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(255,255,255,.025);
}

.timeline-item::before{
  content:"";
  position:absolute;
  left:-5px;
  top:25px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--purple);
  box-shadow:0 0 18px rgba(185,146,255,.55);
}

.timeline-year{
  color:var(--purple);
  font-size:11px;
  font-weight:850;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.timeline-item h3{
  margin-top:8px;
  font-size:21px;
}

.timeline-item p{
  margin-top:9px;
  color:var(--muted);
  font-size:14px;
}

.event-details{
  margin-top:15px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.tag{
  padding:6px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  font-size:10px;
  color:var(--soft);
}

.effect{
  margin-top:17px;
  padding-top:14px;
  border-top:1px solid var(--line);
  color:var(--soft);
  font-size:12px;
}

.surprise{
  margin-top:20px;
  padding:23px;
  border:1px solid rgba(185,146,255,.18);
  border-radius:20px;
  background:rgba(185,146,255,.045);
}

.surprise h3{
  font-size:19px;
}

.surprise p{
  margin-top:9px;
  color:var(--muted);
  font-size:14px;
}

.compare-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
  margin-top:20px;
}

.compare-card{
  padding:20px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.025);
}

"use strict";

/* =========================================================
   SAFE STORAGE
   ========================================================= */

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return structuredCloneSafe(defaultState);
    }

    const parsed = JSON.parse(raw);

    return {
      ...structuredCloneSafe(defaultState),
      ...parsed,
      profile:{
        ...defaultState.profile,
        ...(parsed.profile || {})
      },
      simulations:Array.isArray(parsed.simulations) ? parsed.simulations : [],
      predictions:Array.isArray(parsed.predictions) ? parsed.predictions : [],
      nowStories:Array.isArray(parsed.nowStories) ? parsed.nowStories : [],
      pairStories:Array.isArray(parsed.pairStories) ? parsed.pairStories : [],
      current:parsed.current || defaultState.current
    };
  }catch(e){
    console.warn("Impossibile leggere i dati locali.",e);
    return structuredCloneSafe(defaultState);
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){
    console.warn("Impossibile salvare i dati.",e);
  }
}

function structuredCloneSafe(obj){
  return JSON.parse(JSON.stringify(obj));
}

/* =========================================================
   SECURITY
   ========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function cleanText(value,max=4000){
  return String(value ?? "")
    .replace(/\u0000/g,"")
    .trim()
    .slice(0,max);
}

function id(){
  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID();
  }

  return "id-" + Date.now() + "-" +
    Math.random().toString(36).slice(2);
}

function dateNow(){
  return new Date().toISOString();
}

function formatDate(value){
  try{
    return new Intl.DateTimeFormat("it-IT",{
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }).format(new Date(value));
  }catch{
    return "";
  }
}

/* =========================================================
   SEEDED RANDOMNESS
   ========================================================= */

function hashString(str){
  let h=2166136261;

  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h+=
      (h<<1)+
      (h<<4)+
      (h<<7)+
      (h<<8)+
      (h<<24);
  }

  return h>>>0;
}

function seeded(seed){
  let x = hashString(String(seed)) || 123456789;

  return function(){
    x += 0x6D2B79F5;
    let t=x;
    t=Math.imul(t ^ t>>>15,t|1);
    t^=t+Math.imul(t ^ t>>>7,t|61);
    return ((t ^ t>>>14)>>>0)/4294967296;
  };
}

function pick(arr,rng){
  if(!arr || !arr.length) return "";
  return arr[Math.floor(rng()*arr.length)];
}

function sample(arr,rng,count=1){
  const copy=[...arr];
  const result=[];

  while(copy.length && result.length<count){
    result.push(copy.splice(Math.floor(rng()*copy.length),1)[0]);
  }

  return result;
}

function topicFromText(text){
  const t=(text||"").toLowerCase();

  const scores={
    work:0,
    love:0,
    home:0,
    money:0,
    study:0,
    family:0,
    self:0,
    decision:0,
    communication:0
  };

  const words={
    work:[
      "lavor","ufficio","collega","contratto","stipendio",
      "azienda","licenz","dimetter","carriera","turno",
      "capo","cliente","posto di lavoro"
    ],
    love:[
      "amore","fidanz","marito","moglie","coppia","relazione",
      "ragazzo","ragazza","partner","sentimento","insieme",
      "separ","trad","attraz"
    ],
    home:[
      "casa","trasfer","vivere","affitto","mutuo","quartiere",
      "città","paese","trasloco","abitazione"
    ],
    money:[
      "soldi","debito","debiti","finanz","prestito","stipendio",
      "spese","risparm","conto","credito","pagamento"
    ],
    study:[
      "stud","corso","univers","esame","formazione","imparare"
    ],
    family:[
      "famiglia","figlio","figlia","genitori","madre","padre",
      "fratello","sorella","bambino","bambina"
    ],
    decision:[
      "decidere","decisione","scelta","scegliere","faccio",
      "fare","lasciare","accettare","rifiutare","cambiare"
    ],
    communication:[
      "scrivere","messaggio","telefon","rispondere","parlare",
      "dire","diretto","conversazione","contattare"
    ]
  };

  for(const [topic,arr] of Object.entries(words)){
    for(const word of arr){
      if(t.includes(word)) scores[topic]++;
    }
  }

  const ordered=Object.entries(scores)
    .sort((a,b)=>b[1]-a[1]);

  return ordered[0][1]>0 ? ordered[0][0] : "self";
}

function extractSignals(text){
  const t=(text||"").toLowerCase();

  return {
    urgency:
      /subito|ora|oggi|domani|presto|urgente|devo decidere/.test(t)
        ? 2 : 0,

    change:
      /cambiare|cambio|lasciare|partire|trasfer|nuovo|nuova/.test(t)
        ? 2 : 0,

    fear:
      /paura|temo|ansia|preoccup|terrore|rischio|rischiare/.test(t)
        ? 2 : 0,

    desire:
      /vorrei|voglio|desidero|sogno|mi piacere|sper/.test(t)
        ? 2 : 0,

    stability:
      /sicuro|sicurezza|stabile|tranquill|rimanere|restare/.test(t)
        ? 2 : 0,

    relationship:
      /noi|insieme|coppia|partner|marito|moglie|fidanz|famiglia/.test(t)
        ? 2 : 0,

    money:
      /soldi|denaro|stipendio|debito|debiti|spese|finanz|prestito/.test(t)
        ? 2 : 0,

    communication:
      /scrivere|messaggio|rispondere|parlare|dire|telefon/.test(t)
        ? 2 : 0
  };
}

function profileSignals(){
  const text=[
    state.profile.situation,
    state.profile.goals

function buildSoloQuestions(question){
  const topic=topicFromText(question);
  const signals=extractSignals(question);

  const base=[
    {
      key:"why",
      label:"Cosa ti spinge davvero verso questa possibilità?",
      placeholder:"La motivazione più importante, anche se non è facile da spiegare..."
    },
    {
      key:"fear",
      label:"Cosa ti trattiene?",
      placeholder:"Una paura, una responsabilità, una persona, i soldi, l'incertezza o altro..."
    },
    {
      key:"desired",
      label:"Se questa possibilità andasse nel modo che speri, cosa cambierebbe concretamente?",
      placeholder:"Cosa vorresti trovare dall'altra parte?"
    }
  ];

  const topicQuestions={
    work:[
      {
        key:"workReality",
        label:"Com'è la tua situazione lavorativa attuale e cosa vorresti cambiare?",
        placeholder:"Orari, ambiente, contratto, soldi, crescita, stanchezza..."
      },
      {
        key:"workAlternative",
        label:"Hai già un'alternativa concreta oppure stai ancora cercando di capire?",
        placeholder:"Racconta cosa esiste davvero oggi..."
      }
    ],

    love:[
      {
        key:"relationshipReality",
        label:"Com'è la situazione tra voi in questo momento?",
        placeholder:"Cosa sta funzionando e cosa invece ti pesa?"
      },
      {
        key:"relationshipNeed",
        label:"Cosa vorresti cambiasse davvero?",
        placeholder:"Non quello che pensi di dover volere: quello che desideri..."
      }
    ],

    home:[
      {
        key:"homeReality",
        label:"Cosa comporterebbe concretamente questo cambiamento di casa o luogo?",
        placeholder:"Persone coinvolte, distanza, costi, lavoro, animali, abitudini..."
      },
      {
        key:"homeNeed",
        label:"Cosa speri di trovare nel nuovo scenario?",
        placeholder:"Più spazio, indipendenza, tranquillità, opportunità..."
      }
    ],

    money:[
      {
        key:"moneyReality",
        label:"Qual è il vincolo economico più importante in questa scelta?",
        placeholder:"Entrate, spese, debiti, risparmi, stabilità..."
      },
      {
        key:"moneyPriority",
        label:"Se dovessi proteggere una sola cosa, quale sarebbe?",
        placeholder:"Sicurezza, libertà, tempo, casa, progetto..."
      }
    ],

    study:[
      {
        key:"studyReality",
        label:"Quanto spazio reale hai oggi per questo percorso?",
        placeholder:"Tempo, lavoro, soldi, energie..."
      },
      {
        key:"studyGoal",
        label:"Dove vorresti arrivare attraverso questa scelta?",
        placeholder:"Una nuova professione, una competenza, un cambiamento..."
      }
    ],

    family:[
      {
        key:"familyReality",
        label:"Chi altro verrebbe coinvolto da questa scelta?",
        placeholder:"Persone, responsabilità, equilibri..."
      },
      {
        key:"familyImpact",
        label:"Cosa temi possa cambiare nei rapporti con loro?",
        placeholder:"Racconta ciò che ti preoccupa..."
      }
    ],

    decision:[
      {
        key:"decisionOptions",
        label:"Quali sono oggi le possibilità che stai realmente considerando?",
        placeholder:"Anche se sembrano solo due o tre..."
      },
      {
        key:"decisionCost",
        label:"Qual è il prezzo più grande che senti di pagare in ogni direzione?",
        placeholder:"Cosa perderesti o rischieresti?"
      }
    ],

    communication:[
      {
        key:"communicationContext",
        label:"Cosa è successo subito prima che ti venisse questa domanda?",
        placeholder:"Racconta il contesto..."
      },
      {
        key:"communicationDesired",
        label:"Cosa vorresti ottenere dalla comunicazione?",
        placeholder:"Chiarire, avvicinarti, proteggerti, chiudere, capire..."
      }
    ],

    self:[
      {
        key:"selfContext",
        label:"Da quanto tempo senti che questa possibilità ti gira in testa?",
        placeholder:"Da giorni, mesi, anni o non lo sai..."
      },
      {
        key:"selfChange",
        label:"Quale parte della tua vita pensi cambierebbe di più?",
        placeholder:"Lavoro, relazioni, casa, libertà, identità..."
      }
    ]
  };

  const selected=[...base];

  for(const q of (topicQuestions[topic] || topicQuestions.self)){
    if(selected.length<6) selected.push(q);
  }

  if(signals.urgency && selected.length<7){
    selected.push({
      key:"urgency",
      label:"Perché senti che questa scelta deve essere affrontata proprio adesso?",
      placeholder:"È cambiato qualcosa recentemente?"
    });
  }

  if(signals.relationship && selected.length<7){
    selected.push({
      key:"people",
      label:"C'è qualcuno il cui comportamento potrebbe cambiare il tuo percorso?",
      placeholder:"Chi e in che modo?"
    });
  }

  if(signals.money && selected.length<7){
    selected.push({
      key:"resources",
      label:"Quali risorse o limiti non possiamo ignorare?",
      placeholder:"Soldi, tempo, lavoro, obblighi..."
    });
  }

  return selected.slice(0,7);
}

/* =========================================================
   NARRATIVE STATE
   ========================================================= */

function createNarrativeState(topic,signals,answers){
  const ps=profileSignals();

  return {
    money:50,
    stability:50,
    freedom:50,
    growth:50,
    relationship:50,
    energy:50,
    uncertainty:50,
    courage:50,
    support:50,

    topic,
    signals:{
      ...signals,
      ...Object.fromEntries(
        Object.entries(ps).map(([k,v])=>[
          k,
          Math.max(signals[k]||0,v)
        ])
      )
    },

    answers,

    flags:[],

    history:[]
  };
}

function clamp(n,min=0,max=100){
  return Math.max(min,Math.min(max,n));
}

function applyEffects(stateObj,effects){
  for(const [key,value] of Object.entries(effects || {})){
    if(typeof stateObj[key]==="number"){
      stateObj[key]=clamp(stateObj[key]+value);
    }
  }
}

function stateSnapshot(s){
  return {
    money:s.money,
    stability:s.stability,
    freedom:s.freedom,
    growth:s.growth,
    relationship:s.relationship,
    energy:s.energy,
    uncertainty:s.uncertainty,
    courage:s.courage,
    support:s.support
  };
}

/* =========================================================
   EVENT SELECTION
   ========================================================= */

function eventScore(event,narrative,path,rng){
  let score=5;

  const t=narrative.topic;
  const tags=event.tags || [];

  if(tags.includes(t)) score+=12;

  if(tags.includes("money") && narrative.money<45) score+=5;
  if(tags.includes("stability") && narrative.stability<45) score+=5;
  if(tags.includes("growth") && narrative.growth<55) score+=5;
  if(tags.includes("relationship") && narrative.relationship<55) score+=6;
  if(tags.includes("energy") && narrative.energy<50) score+=4;
  if(tags.includes("freedom") && narrative.freedom<55) score+=5;

  if(path==="change" && tags.includes("growth")) score+=5;
  if(path==="stay" && tags.includes("stability")) score+=5;
  if(path==="third" && tags.includes("freedom")) score+=4;

  score += rng()*7;

  return score;
}

function chooseEvent(narrative,path,used,rng){
  const pool=EVENTS[narrative.topic] || EVENTS.self;

  const candidates=pool.filter(
    e=>!used.includes(e.title)
  );

  if(!candidates.length){
    return pick(pool,rng);
  }

  return candidates
    .map(e=>({e,score:eventScore(e,narrative,path,rng)}))
    .sort((a,b)=>b.score-a.score)[0].e;
}

/* =========================================================
   GENERATE SCENARIO
   ========================================================= */

function generateScenario({
  path,
  question,
  topic,
  signals,
  answers,
  seed
}){
  const rng=seeded(seed+"-"+path);

  const narrative=createNarrativeState(topic,signals,answers);

  /* Path starting state */
  if(path==="change"){
    applyEffects(narrative,{
      freedom:10,
      courage:8,
      stability:-5,
      uncertainty:7,
      growth:6
    });
  }

  if(path==="stay"){
    applyEffects(narrative,{
      stability:10,
      uncertainty:-3,
      freedom:-5,
      growth:2
    });
  }

  if(path==="third"){
    applyEffects(narrative,{
      freedom:6,
      stability:5,
      uncertainty:-4,
      growth:8
    });
  }

  const used=[];
  const events=[];

  for(const year of [1,3,5]){
    const event=chooseEvent(
      narrative,
      path,
      used,
      rng
    );

    used.push(event.title);

    const personalized=personalizeEvent(
      event,
      narrative,
      path,
      year
    );

    applyEffects(narrative,event.effects);

    narrative.history.push({
      year,
      event:event.title,
      state:stateSnapshot(narrative)
    });

    events.push({
      ...personalized,
      effects:event.effects,
      snapshot:stateSnapshot(narrative)
    });

    /* Future years depend on previous state */
    if(year===1){
      if(narrative.growth>65){
        applyEffects(narrative,{courage:5,freedom:4});
      }

      if(narrative.stability<40){
        applyEffects(narrative,{energy:-4,uncertainty:5});
      }
    }

    if(year===3){
      if(narrative.support>65){
        applyEffects(narrative,{stability:5,growth:4});
      }

      if(narrative.money<35){
        applyEffects(narrative,{stability:-4,uncertainty:5});
      }
    }
  }

  const surprise=pick(THIRD_WAY,rng);

  applyEffects(narrative,surprise.effects);

  const ending=buildEnding(narrative,path,topic,rng);

  return {
    id:id(),
    path,
    title:pathTitle(path),
    intro:pathIntro(path,topic,question),
    events,
    surprise:{
      ...surprise,
      snapshot:stateSnapshot(narrative)
    },
    ending,
    finalState:stateSnapshot(narrative)
  };
}

function pathTitle(path){
  return {
    change:"Quella che scegli",
    stay:"Quella che non scegli",
    third:"La terza via"
  }[path];
}

function buildEnding(n,path,topic,rng){
  const context=getContextLabel(topic);

  if(n.growth>70 && n.freedom>65){
    return `Dopo cinque anni, la parte più evidente della storia è il cambiamento del tuo rapporto con la ${context}: non significa che tutto sia semplice, ma hai costruito più spazio per decidere cosa fare dopo.`;
  }

  if(n.stability>70){
    return `Dopo cinque anni, il filo conduttore è una maggiore stabilità. La strada non elimina i problemi, ma rende più prevedibile il modo in cui affrontarli.`;
  }

  if(n.uncertainty>65){
    return `Dopo cinque anni, la storia rimane meno lineare di quanto sembrasse all'inizio. Alcuni eventi hanno spostato il punto di partenza e aperto possibilità che non erano presenti nella domanda originale.`;
  }

  return `Dopo cinque anni, la situazione è diversa da quella da cui sei partito. Alcune conseguenze erano prevedibili, altre sono nate lungo il percorso e hanno modificato ciò che sembrava essere la domanda iniziale.`;
}

    draft.question,
    ...Object.values(answers),

  ].join(" ");

  const topic=topicFromText(combined);
  const signals=extractSignals(combined);

  const seed=
    id()+"-"+Date.now();

  const scenarios=[
    generateScenario({
      path:"change",
      question:draft.question,
      topic,
      signals,
      answers,
      seed
    }),

    generateScenario({
      path:"stay",
      question:draft.question,
      topic,
      signals,
      answers,
      seed
    }),

    generateScenario({
      path:"third",
      question:draft.question,
      topic,
      signals,
      answers,
      seed
    })
  ];

  const simulation={
    id:id(),
    createdAt:dateNow(),
    mode:"E SE?",
    question:draft.question,
    topic,
    answers,
    seed,
    scenarios,
    reflection:"",
    title:makeSimulationTitle(draft.question,topic)
  };

  state.simulations.unshift(simulation);

    createdAt:simulation.createdAt,
    mode:"E SE?",
    title:simulation.title,
    question:simulation.question,
    checks:[]

  state.current.draft=simulation;

  saveState();

  currentPage="soloResult";
  render();
}

}

    simulationId:story.id,
    createdAt:story.createdAt,
    mode:"E SE? IN 2",
    title:story.title,
    question:story.question,
    checks:[]
  });

  state.current.draft=story;

  saveState();

  activeLife=0;
  currentPage="pairResult";
  render();
}

function generatePairScenario({
  path,
  topic,
  signals,
  answersA,
  answersB,
  shared,
  question,
  seed
}){
  const rng=seeded(seed+"-"+path);

  const A=createNarrativeState(topic,signals,answersA);
  const B=createNarrativeState(topic,signals,answersB);

  const sharedState={
    stability:50,
    freedom:50,
    relationship:55,
    money:50,
    uncertainty:50,
    support:50
  };

  if(path==="change"){
    applyEffects(A,{freedom:9,courage:7,stability:-4});
    applyEffects(B,{freedom:8,courage:6,stability:-4});
    applyEffects(sharedState,{freedom:8,uncertainty:7,relationship:2});
  }

  if(path==="stay"){
    applyEffects(A,{stability:9,freedom:-4});
    applyEffects(B,{stability:9,freedom:-4});
    applyEffects(sharedState,{stability:9,uncertainty:-4});
  }

  if(path==="third"){
    applyEffects(A,{growth:7,freedom:6});
    applyEffects(B,{growth:7,freedom:6});
    applyEffects(sharedState,{freedom:6,stability:5,uncertainty:-5});
  }

  const events=[];
  const used=[];

  for(const year of [1,3,5]){
    const pool=EVENTS[topic] || EVENTS.self;

    const e=chooseEvent(
      {
        ...A,
        relationship:sharedState.relationship,
        stability:sharedState.stability,
        money:sharedState.money,
        freedom:sharedState.freedom
      },
      path,
      used,
      rng
    );

    used.push(e.title);

    const who=rng()<.5 ? "A" : "B";

    if(who==="A"){
      applyEffects(A,e.effects);
      applyEffects(sharedState,{
        relationship:Math.round((e.effects.relationship || 0)*.7),
        stability:Math.round((e.effects.stability || 0)*.5),
        money:Math.round((e.effects.money || 0)*.4),
        freedom:Math.round((e.effects.freedom || 0)*.4)
      });
    }else{
      applyEffects(B,e.effects);
      applyEffects(sharedState,{
        relationship:Math.round((e.effects.relationship || 0)*.7),
        stability:Math.round((e.effects.stability || 0)*.5),
        money:Math.round((e.effects.money || 0)*.4),
        freedom:Math.round((e.effects.freedom || 0)*.4)
      });
    }

    const reaction=pairReaction(
      A,
      B,
      sharedState,
      who,
      path
    );

    applyEffects(sharedState,reaction.effects);

    events.push({
      year,
      title:e.title,
      text:e.text,
      affected:who==="A"
        ? "La situazione di A modifica anche la traiettoria condivisa."
        : "La situazione di B modifica anche la traiettoria condivisa.",
      reaction:reaction.text,
      stateA:stateSnapshot(A),
      stateB:stateSnapshot(B),
      sharedState:{...sharedState}
    });
  }

  const surprise=pick(THIRD_WAY,rng);

  return {
    path,
    title:pathTitle(path),
    intro:
      path==="change"
        ? "Entrambi decidono di muoversi verso il cambiamento, ma non necessariamente per le stesse ragioni."
        : path==="stay"
          ? "Entrambi scelgono di mantenere la situazione attuale e vedere come evolve."
          : "La storia cerca una soluzione che non coincide completamente con il desiderio iniziale di nessuno dei due.",
    events,
    surprise,
    ending:pairEnding(sharedState),
    finalState:{
      A:stateSnapshot(A),
      B:stateSnapshot(B),
      shared:{...sharedState}
    }
  };
}

function pairReaction(A,B,shared,path){
  const gap=Math.abs(
    (A.freedom-B.freedom) -
    (A.stability-B.stability)
  );

  if(gap>25){
    return {
      text:"Le esigenze delle due persone iniziano a divergere e la traiettoria condivisa deve essere rinegoziata.",
      effects:{relationship:-5,uncertainty:6}
    };
  }

  if(shared.relationship>65){
    return {
      text:"La capacità di adattarsi reciprocamente riduce l'impatto dell'evento sulla relazione.",
      effects:{relationship:5,uncertainty:-3}
    };
  }

  return {
    text:"L'evento modifica entrambi, anche se in misura diversa, e richiede un nuovo equilibrio.",
    effects:{relationship:1}
  };
}

function pairEnding(shared){
  if(shared.relationship<40){
    return "La traiettoria finale mostra che la questione iniziale è diventata anche una questione di equilibrio tra le due persone.";
  }

  if(shared.freedom>shared.stability+12){
    return "La vita condivisa è diventata più aperta e meno prevedibile, con nuove possibilità ma anche maggiore necessità di coordinarsi.";
  }

  if(shared.stability>shared.freedom+12){
    return "La vita condivisa ha trovato un equilibrio più stabile, con cambiamenti graduali invece di svolte radicali.";
  }

  return "La situazione finale è diversa da quella iniziale soprattutto perché le due persone hanno modificato reciprocamente il proprio percorso.";
}
