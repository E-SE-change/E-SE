<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="E SE? - Un'esperienza narrativa interattiva per esplorare possibilità, decisioni, percorsi alternativi e ciò che accade davvero nel tempo.">
<meta name="theme-color" content="#111111">
<meta name="robots" content="index, follow">

<title>E SE? — Le mie esperienze</title>

<!-- Google AdSense -->
<script async
src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7154454592714745"
crossorigin="anonymous"></script>

<style>
:root{
  --bg:#f7f5f2;
  --surface:#ffffff;
  --surface2:#f0ede8;
  --text:#171717;
  --muted:#77716a;
  --line:#ded9d2;
  --accent:#171717;
  --accent-soft:#e9e4dd;
  --gold:#a88752;
  --danger:#a33a3a;
  --success:#3f7657;
  --shadow:0 12px 35px rgba(0,0,0,.08);
  --radius:22px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

.app{
  min-height:100vh;
}

.container{
  width:min(1080px, calc(100% - 32px));
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(247,245,242,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(0,0,0,.06);
}

.nav{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-weight:900;
  letter-spacing:-1px;
  font-size:22px;
  cursor:pointer;
}

.logo span{
  font-weight:400;
}

.nav-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.icon-btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:999px;
  padding:9px 14px;
}

main{
  padding-bottom:70px;
}

.screen{
  min-height:calc(100vh - 68px);
  padding:55px 0;
}

.hero{
  min-height:calc(100vh - 68px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:850px;
  margin:auto;
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  margin-bottom:18px;
}

h1{
  font-size:clamp(50px,10vw,110px);
  line-height:.9;
  letter-spacing:-5px;
  margin-bottom:28px;
}

h2{
  font-size:clamp(32px,6vw,60px);
  line-height:1;
  letter-spacing:-2px;
  margin-bottom:20px;
}

h3{
  font-size:24px;
  line-height:1.2;
  margin-bottom:10px;
}

.lead{
  font-size:clamp(19px,3vw,25px);
  line-height:1.45;
  max-width:750px;
  color:#393632;
}

.small{
  font-size:14px;
  color:var(--muted);
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:35px;
}

.btn{
  border:0;
  border-radius:999px;
  padding:14px 23px;
  font-weight:750;
  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:#111;
  color:#fff;
}

.btn-secondary{
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--text);
}

.btn-light{
  background:var(--accent-soft);
  color:var(--text);
}

.btn-danger{
  background:#f5dddd;
  color:var(--danger);
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

.intro-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:50px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:27px;
  box-shadow:var(--shadow);
}

.experience-card{
  cursor:pointer;
  min-height:250px;
  transition:.25s ease;
}

.experience-card:hover{
  transform:translateY(-4px);
}

.number{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--accent-soft);
  margin-bottom:25px;
  font-weight:800;
}

.card p{
  color:var(--muted);
}

.section{
  margin-top:55px;
}

.section-title{
  margin-bottom:22px;
}

.section-title h2{
  font-size:35px;
  margin-bottom:7px;
}

.profile-box{
  max-width:720px;
  margin:auto;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.field{
  margin-bottom:20px;
}

.field.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:750;
  margin-bottom:8px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:15px;
  padding:13px 15px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#888;
  box-shadow:0 0 0 3px rgba(0,0,0,.05);
}

textarea{
  min-height:130px;
  resize:vertical;
}

.choice-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.choice{
  position:relative;
}

.choice input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.choice label{
  margin:0;
  padding:15px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:15px;
  cursor:pointer;
  font-weight:600;
  transition:.15s;
}

.choice input:checked + label{
  background:#111;
  color:#fff;
  border-color:#111;
}

.question-card{
  max-width:820px;
  margin:25px auto;
}

.question-number{
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-bottom:10px;
}

.progress{
  width:100%;
  height:7px;
  background:#e4e0db;
  border-radius:99px;
  overflow:hidden;
  margin:20px 0 30px;
}

.progress-bar{
  height:100%;
  background:#111;
  width:0%;
  transition:.3s;
}

.option-list{
  display:grid;
  gap:10px;
  margin-top:20px;
}

.option-btn{
  text-align:left;
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  padding:17px 18px;
  border-radius:15px;
  transition:.15s;
}

.option-btn:hover{
  border-color:#777;
  background:#f9f8f6;
}

.option-btn.selected{
  background:#111;
  color:#fff;
  border-color:#111;
}

.actions{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-top:25px;
}

.story{
  max-width:820px;
  margin:30px auto;
}

.story-cover{
  padding:40px;
  background:#111;
  color:#fff;
  border-radius:28px;
  margin-bottom:20px;
}

.story-cover .eyebrow{
  color:#aaa;
}

.story-block{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:28px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.story-block p{
  margin-bottom:14px;
}

.story-block p:last-child{
  margin-bottom:0;
}

.story-label{
  color:var(--gold);
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:2px;
  font-weight:900;
  margin-bottom:9px;
}

.scenario-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:25px;
}

.scenario-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:25px;
}

.scenario-card h3{
  margin-bottom:12px;
}

.scenario-card p{
  color:#55504b;
}

.future-box{
  margin-top:20px;
  padding:25px;
  border-radius:22px;
  background:#eeebe6;
  border:1px solid var(--line);
}

.future-row{
  padding:17px 0;
  border-bottom:1px solid var(--line);
}

.future-row:last-child{
  border-bottom:0;
}

.timeline{
  margin-top:25px;
  position:relative;
}

.timeline-item{
  position:relative;
  padding:0 0 30px 28px;
  border-left:2px solid #d7d2cb;
}

.timeline-item:last-child{
  border-left-color:transparent;
}

.timeline-dot{
  position:absolute;
  left:-7px;
  top:3px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#111;
}

.timeline-item h4{
  margin-bottom:5px;
}

.timeline-item p{
  color:var(--muted);
}

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:999px;
  padding:6px 11px;
  background:var(--accent-soft);
  font-size:12px;
  font-weight:800;
}

.experience-list{
  display:grid;
  gap:12px;
}

.saved-exp{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.saved-exp-info{
  min-width:0;
}

.saved-exp-info strong{
  display:block;
  margin-bottom:3px;
}

.saved-exp-info span{
  color:var(--muted);
  font-size:13px;
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.notice{
  background:#f0ece5;
  border:1px solid var(--line);
  padding:17px;
  border-radius:16px;
  margin-bottom:20px;
}

.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.compare > div{
  padding:20px;
  border-radius:18px;
  background:#fff;
  border:1px solid var(--line);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.open{
  display:flex;
}

.modal-content{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:25px;
  padding:28px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
}

footer{
  border-top:1px solid var(--line);
  padding:35px 0;
  color:var(--muted);
  font-size:13px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#111;
  color:#fff;
  padding:13px 18px;
  border-radius:999px;
  z-index:500;
  transition:.3s;
  opacity:0;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

.ad-container{
  min-height:90px;
  margin:25px auto;
  text-align:center;
  overflow:hidden;
}

@media(max-width:760px){
  .container{
    width:min(100% - 22px,1080px);
  }

  .screen{
    padding:35px 0;
  }

  h1{
    letter-spacing:-3px;
  }

  .intro-grid,
  .scenario-grid,
  .form-grid,
  .choice-grid,
  .compare{
    grid-template-columns:1fr;
  }

  .card,
  .story-block,
  .story-cover{
    padding:21px;
  }

  .nav{
    min-height:60px;
  }

  .nav-actions .icon-btn{
    padding:8px 11px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="container nav">
    <div class="logo" onclick="goHome()">E <span>SE?</span></div>
    <div class="nav-actions">
      <button class="icon-btn" onclick="showSaved()">Le mie esperienze</button>
      <button class="icon-btn" onclick="openProfile()">Profilo</button>
    </div>
  </div>
</header>

<main id="main"></main>

<footer>
  <div class="container">
    <strong>E SE?</strong><br>
    Un'esperienza narrativa interattiva per esplorare possibilità, decisioni e ciò che accade davvero nel tempo.
  </div>
</footer>

</div>

<div id="toast" class="toast"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <div class="eyebrow">Profilo</div>
        <h3>Le tue informazioni</h3>
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   E SE? — APP CORE
   Tutti i dati vengono salvati nel browser dell'utente.
========================================================= */

const STORAGE_KEY = "ESE_APP_DATA_V1";

let appData = {
  profile: null,
  experiences: []
};

let current = {
  type:null,
  step:0,
  answers:{},
  secondAnswers:{},
  scenario:null,
  experienceId:null
};

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      appData = {
        profile: parsed.profile || null,
        experiences: Array.isArray(parsed.experiences) ? parsed.experiences : []
      };
    }
  }catch(e){
    console.error(e);
  }
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
}

loadData();

function escapeHTML(str){
  if(str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2600);
}

function goHome(){
  renderHome();
  window.scrollTo(0,0);
}

function renderHome(){
  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="hero">
          <div class="eyebrow">Le tue possibilità. Le tue scelte. La tua storia.</div>
          <h1>E SE?</h1>
          <p class="lead">
            Una storia che non finisce quando chiudi l'app.
            Parti da una possibilità che stai considerando, esplora cosa potrebbe accadere,
            scegli la tua strada e torna più avanti per raccontare cosa è successo davvero.
          </p>

          <div class="hero-actions">
            <button class="btn btn-primary" onclick="startEntry()">
              INIZIA UN'ESPERIENZA
            </button>
            <button class="btn btn-secondary" onclick="showSaved()">
              LE MIE ESPERIENZE
            </button>
          </div>
        </div>

        <div class="intro-grid">

          <div class="card experience-card" onclick="beginExperience('ese')">
            <div class="number">01</div>
            <h3>E SE?</h3>
            <p>
              C'è qualcosa che vorresti fare, ma non sai se farlo?
              Esplora cosa potrebbe accadere se scegli di farlo,
              di non farlo oppure se la realtà prende una strada diversa.
            </p>
          </div>

          <div class="card experience-card" onclick="beginExperience('due')">
            <div class="number">02</div>
            <h3>E SE? IN 2</h3>
            <p>
              Una possibilità che riguarda te e un'altra persona.
              Due punti di vista, decisioni, emozioni e percorsi che possono
              incontrarsi o prendere direzioni diverse.
            </p>
          </div>

          <div class="card experience-card" onclick="beginExperience('adesso')">
            <div class="number">03</div>
            <h3>E ADESSO?</h3>
            <p>
              Parti da ciò che sta succedendo adesso e prova a vedere
              come potrebbe evolvere la situazione nel tempo.
            </p>
          </div>

        </div>

        <section class="section">
          <div class="section-title">
            <div class="eyebrow">Come funziona</div>
            <h2>Non è una storia e basta.</h2>
            <p class="lead">
              È un percorso che puoi riprendere quando vuoi.
            </p>
          </div>

          <div class="scenario-grid">
            <div class="card">
              <h3>Immagina</h3>
              <p>
                Parti da una possibilità reale, da un desiderio o da una situazione.
              </p>
            </div>

            <div class="card">
              <h3>Scegli</h3>
              <p>
                Esplora strade diverse senza che l'app scelga al posto tuo.
              </p>
            </div>

            <div class="card">
              <h3>Vivi la storia</h3>
              <p>
                Ogni percorso sviluppa eventi, emozioni, conseguenze e possibili svolte.
              </p>
            </div>

            <div class="card">
              <h3>Torna</h3>
              <p>
                Tra una settimana, due mesi o un anno puoi raccontare cosa è successo davvero.
              </p>
            </div>
          </div>
        </section>

        <div class="ad-container">
          <ins class="adsbygoogle"
               style="display:block"
               data-ad-client="ca-pub-7154454592714745"
               data-ad-slot=""
               data-ad-format="auto"
               data-full-width-responsive="true"></ins>
        </div>

      </div>
    </section>
  `;

  try{
    (adsbygoogle = window.adsbygoogle || []).push({});
  }catch(e){}
}

function startEntry(){
  if(!appData.profile){
    openProfile(true);
  }else{
    renderExperienceChooser();
  }
}

function renderExperienceChooser(){
  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="section-title">
          <div class="eyebrow">Benvenuta${appData.profile?.name ? ", "+escapeHTML(appData.profile.name) : ""}</div>
          <h2>Da dove vuoi cominciare?</h2>
          <p class="lead">
            Scegli l'esperienza che vuoi vivere.
            Potrai tornare qui ogni volta che vorrai.
          </p>
        </div>

        <div class="intro-grid">

          <div class="card experience-card" onclick="beginExperience('ese')">
            <div class="number">01</div>
            <h3>E SE?</h3>
            <p>
              Una cosa che vorresti fare, ma non sai se farla.
            </p>
            <div class="hero-actions">
              <span class="status">Esplora una possibilità</span>
            </div>
          </div>

          <div class="card experience-card" onclick="beginExperience('due')">
            <div class="number">02</div>
            <h3>E SE? IN 2</h3>
            <p>
              Una scelta, un desiderio o un cambiamento che coinvolge due persone.
            </p>
            <div class="hero-actions">
              <span class="status">Esplora insieme</span>
            </div>
          </div>

          <div class="card experience-card" onclick="beginExperience('adesso')">
            <div class="number">03</div>
            <h3>E ADESSO?</h3>
            <p>
              Una situazione che sta accadendo adesso e che vuoi capire come potrebbe evolvere.
            </p>
            <div class="hero-actions">
              <span class="status">Guarda avanti</span>
            </div>
          </div>

        </div>

        <div class="section">
          <button class="btn btn-secondary" onclick="goHome()">← Torna alla home</button>
        </div>

      </div>
    </section>
  `;
}

function openProfile(force=false){
  const p=appData.profile || {};

  document.getElementById("modalBody").innerHTML=`
    <form onsubmit="saveProfile(event,${force})">

      <div class="field">
        <label for="pName">Nome</label>
        <input id="pName" required maxlength="50" value="${escapeHTML(p.name || "")}" placeholder="Come vuoi essere chiamato/a?">
      </div>

      <div class="field">
        <label for="pAge">Età</label>
        <input id="pAge" type="number" min="13" max="120" required value="${p.age || ""}" placeholder="Età">
      </div>

      <div class="field">
        <label for="pSign">Segno zodiacale</label>
        <select id="pSign" required>
          <option value="">Seleziona</option>
          ${[
            "Ariete","Toro","Gemelli","Cancro","Leone","Vergine",
            "Bilancia","Scorpione","Sagittario","Capricorno","Acquario","Pesci"
          ].map(s=>`<option ${p.sign===s?"selected":""}>${s}</option>`).join("")}
        </select>
      </div>

      <div class="field">
        <label for="pRelationship">Situazione sentimentale</label>
        <select id="pRelationship" required>
          <option value="">Seleziona</option>
          ${[
            "Single",
            "In frequentazione",
            "Fidanzato/a",
            "Sposato/a",
            "Separato/a",
            "È complicato",
            "Preferisco non definirla"
          ].map(s=>`<option ${p.relationship===s?"selected":""}>${s}</option>`).join("")}
        </select>
      </div>

      <div class="notice">
        Queste informazioni vengono salvate sul dispositivo per non doverle inserire ogni volta.
        Puoi modificarle quando vuoi dal tuo Profilo.
      </div>

      <div class="actions">
        ${!force ? `<button type="button" class="btn btn-secondary" onclick="closeModal()">Annulla</button>` : `<span></span>`}
        <button class="btn btn-primary">Salva profilo</button>
      </div>

    </form>
  `;

  document.getElementById("modal").classList.add("open");
}

function saveProfile(event,force=false){
  event.preventDefault();

  appData.profile={
    name:document.getElementById("pName").value.trim(),
    age:Number(document.getElementById("pAge").value),
    sign:document.getElementById("pSign").value,
    relationship:document.getElementById("pRelationship").value
  };

  saveData();
  closeModal();
  toast("Profilo salvato.");

  if(force){
    renderExperienceChooser();
  }
}

function closeModal(){
  document.getElementById("modal").classList.remove("open");
}

function beginExperience(type){
  if(!appData.profile){
    openProfile(true);
    return;
  }

  current={
    type,
    step:0,
    answers:{},
    secondAnswers:{},
    scenario:null,
    experienceId:null
  };

  const saved=appData.experiences.filter(e=>e.type===type);

  if(saved.length){
    renderExperienceStart(type,saved);
  }else{
    renderQuestions(type);
  }
}

function experienceName(type){
  return {
    ese:"E SE?",
    due:"E SE? IN 2",
    adesso:"E ADESSO?"
  }[type];
}

function renderExperienceStart(type,saved){
  const latest=saved[saved.length-1];

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="section-title">
          <div class="eyebrow">${experienceName(type)}</div>
          <h2>Continuiamo?</h2>
          <p class="lead">
            Hai già iniziato ${saved.length>1 ? "più volte" : "questa esperienza"}.
            Puoi riprendere l'ultima storia oppure crearne una nuova.
          </p>
        </div>

        <div class="card question-card">
          <h3>${escapeHTML(latest.title || "La tua esperienza")}</h3>
          <p class="small">
            Ultimo aggiornamento: ${formatDate(latest.updatedAt)}
          </p>

          <div class="hero-actions">
            <button class="btn btn-primary" onclick="openSavedExperience('${latest.id}')">
              Riprendi la storia
            </button>
            <button class="btn btn-secondary" onclick="renderQuestions('${type}')">
              Inizia una nuova
            </button>
          </div>
        </div>

        <div class="section">
          <button class="btn btn-secondary" onclick="renderExperienceChooser()">← Torna alle esperienze</button>
        </div>

      </div>
    </section>
  `;
}

function renderQuestions(type){
  const questions=getQuestions(type);

  if(current.step>=questions.length){
    generateExperience();
    return;
  }

  const q=questions[current.step];
  const total=questions.length;
  const progress=(current.step/total)*100;
  const answers=current.answers;

  let body="";

  if(q.kind==="text"){
    body=`
      <textarea id="questionText" maxlength="1200" placeholder="${escapeHTML(q.placeholder || "Scrivi quello che senti davvero...")}">${escapeHTML(answers[q.id]||"")}</textarea>
    `;
  }else{
    body=`
      <div class="option-list">
        ${q.options.map((o,i)=>`
          <button class="option-btn ${answers[q.id]===o?"selected":""}"
                  onclick="selectAnswer('${q.id}',${JSON.stringify(o)})">
            ${escapeHTML(o)}
          </button>
        `).join("")}
      </div>
    `;
  }

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="question-card">
          <div class="eyebrow">${experienceName(type)}</div>

          <div class="progress">
            <div class="progress-bar" style="width:${progress}%"></div>
          </div>

          <div class="question-number">
            Domanda ${current.step+1} di ${total}
          </div>

          <h2>${escapeHTML(q.question)}</h2>
          ${q.help ? `<p class="small">${escapeHTML(q.help)}</p>` : ""}

          ${body}

          <div class="actions">
            <button class="btn btn-secondary"
                    onclick="questionBack('${type}')"
                    ${current.step===0?"disabled":""}>
              ← Indietro
            </button>

            <button class="btn btn-primary" onclick="questionNext('${type}')">
              ${current.step===total-1 ? "Costruisci la storia" : "Continua →"}
            </button>
          </div>
        </div>

      </div>
    </section>
  `;

  if(q.kind==="text"){
    const input=document.getElementById("questionText");
    if(input) input.focus();
  }
}

function selectAnswer(id,value){
  current.answers[id]=value;
  renderQuestions(current.type);
}

function questionNext(type){
  const q=getQuestions(type)[current.step];

  if(q.kind==="text"){
    const val=document.getElementById("questionText")?.value.trim();
    if(!val){
      toast("Scrivi qualcosa prima di continuare.");
      return;
    }
    current.answers[q.id]=val;
  }

  current.step++;
  renderQuestions(type);
}

function questionBack(type){
  if(current.step>0){
    current.step--;
    renderQuestions(type);
  }
}

function generateExperience(){
  if(current.type==="ese"){
    generateESE();
  }else if(current.type==="due"){
    generateDUE();
  }else{
    generateADESSO();
  }
}

function makeId(){
  return "exp_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function randomFrom(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function saveNewExperience(data){
  const id=makeId();
  const exp={
    id,
    type:current.type,
    title:data.title,
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString(),
    stage:0,
    data,
    updates:[],
    completed:false
  };

  appData.experiences.push(exp);
  saveData();

  current.experienceId=id;
  current.scenario=data;

  renderStory(exp);
}

function generateESE(){

  const a=current.answers;
  const desire=a.desire || "una possibilità importante";
  const importance=a.importance || "Molto";
  const block=a.block || "Non sapere cosa succederà";
  const readiness=a.readiness || "Ci sto pensando";
  const desired=a.desired || "la mia quotidianità";
  const fear=a.fear || "le conseguenze";

  const title=shortTitle(desire);

  const first = buildESEScenario(
    "SE LO FAI",
    desire,
    importance,
    block,
    readiness,
    desired,
    fear,
    true
  );

  const second = buildESEScenario(
    "SE NON LO FAI",
    desire,
    importance,
    block,
    readiness,
    desired,
    fear,
    false
  );

  const third = buildUnexpectedScenario(desire, fear, desired);

  saveNewExperience({
    title,
    prompt:desire,
    scenarios:[first,second,third],
    prediction:buildPredictionESE(desire,readiness,importance),
    questionAnswers:a,
    narrativeSeed:desire
  });
}

function buildESEScenario(label,desire,importance,block,readiness,desired,fear,yes){

  if(yes){
    return {
      label,
      title:"La possibilità prende forma",
      text:[
        `All'inizio non cambia tutto. Cambia una cosa piccola: smetti di limitarti a immaginare "${desire}" e fai un primo passo.`,
        `La parte più interessante arriva subito dopo. La realtà non segue esattamente il copione che avevi in testa. C'è una risposta, un silenzio, un dettaglio o una reazione che ti costringe a guardare la situazione da un'altra angolazione.`,
        `Nei giorni successivi cominci a capire che la scelta non riguarda soltanto ${desired.toLowerCase()}. Riguarda anche il modo in cui ti senti quando finalmente fai qualcosa che avevi continuato a rimandare.`,
        `La tua paura principale — ${fear.toLowerCase()} — non sparisce automaticamente. Ma adesso hai qualcosa che prima non avevi: informazioni reali.`,
        `Ed è proprio lì che la storia cambia. Non devi più chiederti soltanto "e se lo facessi?". Puoi chiederti "adesso che l'ho fatto, cosa voglio fare di ciò che è successo?"`
      ]
    };
  }

  return {
    label,
    title:"La possibilità rimane aperta",
    text:[
      `Decidi di non farlo, almeno per adesso. All'inizio potrebbe sembrarti di aver semplicemente rimandato.`,
      `Poi passano alcuni giorni e ti accorgi che la scelta di non agire produce comunque una conseguenza: continui a chiederti come sarebbe andata.`,
      `La tua paura — ${fear.toLowerCase()} — rimane sullo sfondo, ma insieme a lei compare qualcosa di diverso: la consapevolezza di quanto questa possibilità conti davvero per te.`,
      `Con il tempo può succedere qualcosa che non avevi previsto. Potresti cambiare idea, trovare un momento migliore oppure scoprire che ciò che volevi non era esattamente quello che pensavi.`,
      `La storia, quindi, non è chiusa. Hai semplicemente lasciato una porta aperta.`
    ]
  };
}

function buildUnexpectedScenario(desire,fear,desired){

  return {
    label:"SE SUCCEDE QUALCOS'ALTRO",
    title:"La strada che non avevi previsto",
    text:[
      `Immagini di dover scegliere tra fare o non fare "${desire}". Ma la realtà potrebbe toglierti quella scelta dalle mani per un momento.`,
      `Può arrivare un evento esterno, una conversazione, una persona o una nuova informazione che modifica il significato della decisione.`,
      `Quello che sembrava essere il problema principale potrebbe smettere di esserlo. E qualcosa che avevi considerato secondario potrebbe diventare improvvisamente importante.`,
      `La parte imprevedibile è che non tutto ciò che temi — ${fear.toLowerCase()} — si presenta nello stesso modo in cui lo avevi immaginato.`,
      `A quel punto ${desired.toLowerCase()} potrebbe essere ancora importante, ma la domanda potrebbe essere diventata un'altra.`
    ]
  };
}

function buildPredictionESE(desire,readiness,importance){

  const intensity =
    importance==="Tantissimo" ? "molto forte" :
    importance==="Molto" ? "significativa" :
    "ancora in fase di esplorazione";

  return [
    {
      time:"Nei prossimi giorni",
      text:`La possibilità di "${desire}" potrebbe tornare più volte nei tuoi pensieri. Il fatto che tu la stia considerando indica che per te ha un'importanza ${intensity}.`
    },
    {
      time:"Nelle prossime settimane",
      text:`Potrebbe diventare più chiaro cosa ti blocca davvero. ${readiness==="Potrei farlo molto presto" ? "Potresti arrivare rapidamente a un momento concreto." : "Potresti invece aver bisogno di altre informazioni prima di agire."}`
    },
    {
      time:"Nei prossimi mesi",
      text:`Il punto interessante non sarà soltanto ciò che accadrà, ma ciò che scoprirai su questa possibilità dopo aver avuto più elementi reali.`
    }
  ];
}

function generateDUE(){

  const a=current.answers;

  const person=a.person || "l'altra persona";
  const desire=a.desire || "una possibilità da vivere insieme";
  const importance=a.importance || "Molto";
  const other=a.other || "Non ne ho idea";
  const concern=a.concern || "Non lo sappiamo ancora";
  const feeling=a.prediction || "Curiosità";
  const open=a.open || "che succeda qualcosa di importante";

  const first={
    label:"SE LO FATE",
    title:"La scelta condivisa",
    text:[
      `La decisione comincia con una conversazione. Non necessariamente una conversazione perfetta: forse ci sono esitazioni, frasi lasciate a metà e cose che ognuno pensa senza dirle subito.`,
      `Tu senti ${feeling.toLowerCase()}. L'altra persona potrebbe vivere la stessa possibilità in modo diverso, soprattutto perché oggi pensi che la desideri "${other.toLowerCase()}".`,
      `La scelta di provarci porta qualcosa di concreto: dovete iniziare a prendere decisioni vere, non più soltanto immaginare "${desire}".`,
      `La difficoltà principale potrebbe riguardare ${concern.toLowerCase()}, ma proprio affrontarla insieme può far emergere qualcosa che prima non vedevate.`,
      `Dopo il primo passo la domanda non sarà più "lo facciamo?". Sarà "come vogliamo vivere quello che abbiamo iniziato?"`
    ]
  };

  const second={
    label:"SE NON LO FATE",
    title:"La scelta rimandata",
    text:[
      `Decidete di non farlo, oppure nessuno dei due trova il momento giusto per trasformare l'idea in qualcosa di concreto.`,
      `Per un po' la decisione sembra tranquilla. Poi uno dei due potrebbe tornare sull'argomento, magari in un momento completamente diverso.`,
      `La cosa interessante è che nel frattempo potreste essere cambiati entrambi. Ciò che oggi sembra impossibile potrebbe diventare più semplice, oppure potrebbe perdere importanza.`,
      `La possibilità rimane quindi come una frase non ancora conclusa.`,
      `E quando tornerete a parlarne, potreste scoprire che non state più decidendo esattamente la stessa cosa.`
    ]
  };

  const third={
    label:"SE SUCCEDE QUALCOSA DI DIVERSO",
    title:"Quando la realtà modifica il piano",
    text:[
      `La vostra scelta potrebbe non arrivare mai nella forma che state immaginando.`,
      `Una nuova opportunità, un problema, una persona o un cambiamento esterno potrebbe costringervi a rivedere il piano.`,
      `Questo non significa necessariamente che il desiderio iniziale scompaia. Potrebbe semplicemente cambiare forma.`,
      `E proprio lì potreste scoprire quanto siete disposti a venirvi incontro.`,
      `La domanda diventerebbe: "Vogliamo ancora la stessa cosa, oppure vogliamo vedere cosa può nascere da questa nuova situazione?"`
    ]
  };

  saveNewExperience({
    title:shortTitle(desire),
    prompt:desire,
    person,
    scenarios:[first,second,third],
    prediction:buildPredictionDUE(desire,importance,other,concern),
    questionAnswers:a,
    narrativeSeed:open
  });
}

function buildPredictionDUE(desire,importance,other,concern){

  return [
    {
      time:"Nei prossimi giorni",
      text:`La possibilità di "${desire}" potrebbe diventare un argomento sempre più concreto tra voi, soprattutto se per entrambi ha un'importanza ${importance.toLowerCase()}.`
    },
    {
      time:"Nelle prossime settimane",
      text:`Potrebbe emergere una differenza tra ciò che pensi voglia l'altra persona e ciò che realmente vuole. ${other==="Non ne ho idea" ? "Proprio per questo una conversazione sincera potrebbe cambiare molto la situazione." : "Capire quanto siete realmente allineati potrebbe diventare importante."}`
    },
    {
      time:"Nei prossimi mesi",
      text:`Il tema di ${concern.toLowerCase()} potrebbe diventare uno dei punti che determineranno il modo in cui questa possibilità prenderà forma.`
    }
  ];
}

function generateADESSO(){

  const a=current.answers;
  const situation=a.current || "la situazione che stai vivendo";
  const feeling=a.feeling || "Confuso/a";
  const control=a.control || "Non lo so";
  const wish=a.wish || "che le cose prendano una direzione migliore";
  const fear=a.fear || "Fare una scelta sbagliata";

  const timeline=[
    {
      time:"Adesso",
      text:`Sei dentro questa situazione: ${situation}. La vivi soprattutto con una sensazione di ${feeling.toLowerCase()}.`
    },
    {
      time:"Tra qualche settimana",
      text:`Potrebbe diventare più evidente quali aspetti dipendono davvero da te. Il tuo senso di controllo oggi è "${control.toLowerCase()}", ma avere nuove informazioni può modificare molto questa percezione.`
    },
    {
      time:"Nei prossimi mesi",
      text:`La situazione potrebbe non risolversi in un unico momento. Potrebbero esserci piccoli cambiamenti che, messi insieme, iniziano a spostare il quadro.`
    },
    {
      time:"Più avanti",
      text:`Potresti guardare indietro e accorgerti che la svolta non è stata un singolo evento, ma una serie di piccole decisioni.`
    }
  ];

  saveNewExperience({
    title:shortTitle(situation),
    prompt:situation,
    scenarios:[],
    prediction:[],
    timeline,
    wish,
    fear,
    questionAnswers:a,
    narrativeSeed:situation
  });
}

function shortTitle(text){
  if(!text) return "La mia possibilità";
  let t=String(text).trim();
  if(t.length>58) t=t.slice(0,58).trim()+"…";
  return t.charAt(0).toUpperCase()+t.slice(1);
}

function renderStory(exp){

  if(exp.type==="adesso"){
    renderAdessoStory(exp);
    return;
  }

  const scenarios=exp.data.scenarios || [];

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="story">

          <div class="story-cover">
            <div class="eyebrow">${experienceName(exp.type)}</div>
            <h2>${escapeHTML(exp.title)}</h2>
            <p>
              Questa non è una previsione certa.
              È una possibile storia costruita a partire da ciò che hai raccontato.
            </p>
          </div>

          <div class="story-block">
            <div class="story-label">Da dove siamo partiti</div>
            <h3>${escapeHTML(exp.data.prompt)}</h3>
            <p>
              La tua esperienza parte da una possibilità reale.
              Da qui non c'è una strada giusta: ci sono strade diverse da esplorare.
            </p>
          </div>

          <div class="scenario-grid">
            ${scenarios.map((s,i)=>`
              <div class="scenario-card">
                <div class="story-label">${escapeHTML(s.label)}</div>
                <h3>${escapeHTML(s.title)}</h3>

                ${s.text.map(p=>`<p>${escapeHTML(p)}</p>`).join("")}

                <button class="btn btn-light"
                        onclick="chooseScenario('${exp.id}',${i})">
                  Esplora questo percorso →
                </button>
              </div>
            `).join("")}
          </div>

          ${renderPrediction(exp.data.prediction)}

          <div class="story-block">
            <div class="story-label">E adesso?</div>
            <h3>La storia non finisce qui.</h3>
            <p>
              Puoi scegliere uno dei percorsi e continuare la narrazione.
              Poi potrai tornare in qualsiasi momento per raccontare cosa è successo davvero.
            </p>

            <div class="hero-actions">
              <button class="btn btn-primary" onclick="chooseScenario('${exp.id}',0)">
                Inizia a viverla
              </button>
              <button class="btn btn-secondary" onclick="showSaved()">
                Salva e torna alle mie esperienze
              </button>
            </div>
          </div>

        </div>

      </div>
    </section>
  `;
}

function renderPrediction(prediction){

  if(!prediction || !prediction.length) return "";

  return `
    <div class="story-block">
      <div class="story-label">Possibili sviluppi</div>
      <h3>Quello che potrebbe succedere</h3>

      <div class="future-box">
        ${prediction.map(p=>`
          <div class="future-row">
            <strong>${escapeHTML(p.time)}</strong>
            <p>${escapeHTML(p.text)}</p>
          </div>
        `).join("")}
      </div>

      <p class="small" style="margin-top:15px;">
        Sono scenari possibili, non certezze. La realtà può prendere una direzione completamente diversa.
      </p>
    </div>
  `;
}

function renderAdessoStory(exp){

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="story">

          <div class="story-cover">
            <div class="eyebrow">E ADESSO?</div>
            <h2>${escapeHTML(exp.title)}</h2>
            <p>
              Partiamo da ciò che sta accadendo e guardiamo come potrebbe evolvere.
            </p>
          </div>

          <div class="story-block">
            <div class="story-label">La situazione</div>
            <p>${escapeHTML(exp.data.prompt)}</p>
          </div>

          <div class="story-block">
            <div class="story-label">Il percorso</div>

            <div class="timeline">
              ${exp.data.timeline.map(item=>`
                <div class="timeline-item">
                  <span class="timeline-dot"></span>
                  <h4>${escapeHTML(item.time)}</h4>
                  <p>${escapeHTML(item.text)}</p>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="story-block">
            <div class="story-label">Quello che desideri</div>
            <h3>${escapeHTML(exp.data.wish)}</h3>
            <p>
              Il percorso non deve portarti necessariamente verso questa soluzione.
              Serve a esplorare cosa potrebbe succedere partendo da ciò che oggi desideri.
            </p>
          </div>

          <div class="story-block">
            <div class="story-label">Continua nel tempo</div>
            <p>
              Torna quando la situazione cambia e racconta cosa è successo.
              La storia verrà aggiornata da quel momento.
            </p>

            <div class="hero-actions">
              <button class="btn btn-primary" onclick="updateExperience('${exp.id}')">
                Racconta cosa è successo
              </button>
              <button class="btn btn-secondary" onclick="showSaved()">
                Salva e torna alle mie esperienze
              </button>
            </div>
          </div>

        </div>

      </div>
    </section>
  `;
}

function chooseScenario(id,index){

  const exp=appData.experiences.find(e=>e.id===id);
  if(!exp) return;

  exp.stage=1;
  exp.data.selectedScenario=index;
  exp.updatedAt=new Date().toISOString();
  saveData();

  const scenario=exp.data.scenarios[index];

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="story">

          <div class="story-cover">
            <div class="eyebrow">${escapeHTML(scenario.label)}</div>
            <h2>${escapeHTML(scenario.title)}</h2>
            <p>
              Questa è una possibile direzione. La storia continuerà a cambiare
              in base a ciò che accadrà realmente.
            </p>
          </div>

          <div class="story-block">
            <div class="story-label">La storia</div>

            ${scenario.text.map((p,i)=>`
              <p>${escapeHTML(p)}</p>
            `).join("")}
          </div>

          <div class="story-block">
            <div class="story-label">Una domanda per il prossimo capitolo</div>
            <h3>
              Se questa fosse davvero la tua storia, quale sarebbe la cosa che vorresti scoprire per prima?
            </h3>

            <textarea id="chapterThought"
                      maxlength="1000"
                      placeholder="Scrivi quello che pensi..."></textarea>

            <div class="actions">
              <button class="btn btn-secondary" onclick="renderStoryById('${id}')">
                ← Torna ai percorsi
              </button>

              <button class="btn btn-primary" onclick="saveChapterThought('${id}')">
                Continua →
              </button>
            </div>
          </div>

        </div>

      </div>
    </section>
  `;
}

function saveChapterThought(id){

  const exp=appData.experiences.find(e=>e.id===id);
  if(!exp) return;

  const text=document.getElementById("chapterThought").value.trim();

  if(!text){
    toast("Scrivi la tua risposta per continuare.");
    return;
  }

  if(!exp.updates) exp.updates=[];

  exp.updates.push({
    date:new Date().toISOString(),
    kind:"thought",
    text
  });

  exp.stage=2;
  exp.updatedAt=new Date().toISOString();

  saveData();

  renderContinuation(exp);
}

function renderContinuation(exp){

  const selected=exp.data.scenarios?.[exp.data.selectedScenario];

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="story">

          <div class="story-cover">
            <div class="eyebrow">CAPITOLO SUCCESSIVO</div>
            <h2>Adesso la storia è nelle tue mani.</h2>
            <p>
              Quello che hai appena immaginato rimane salvato.
              Ma la parte più interessante arriverà quando la realtà inizierà a rispondere.
            </p>
          </div>

          <div class="story-block">
            <div class="story-label">Il percorso scelto</div>
            <h3>${escapeHTML(selected?.title || "Il tuo percorso")}</h3>
            <p>
              Non devi decidere oggi come andrà a finire.
              Puoi semplicemente lasciare che la situazione evolva.
            </p>
          </div>

          <div class="story-block">
            <div class="story-label">Quando torni</div>
            <h3>Ti chiederemo una cosa molto semplice:</h3>
            <p style="font-size:20px;">
              <strong>“Alla fine, cos'è successo davvero?”</strong>
            </p>

            <button class="btn btn-primary" onclick="updateExperience('${exp.id}')">
              Aggiorna la storia
            </button>
          </div>

        </div>

      </div>
    </section>
  `;
}

function updateExperience(id){

  const exp=appData.experiences.find(e=>e.id===id);
  if(!exp) return;

  current.experienceId=id;

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="question-card">
          <div class="eyebrow">${experienceName(exp.type)}</div>

          <h2>Cos'è successo davvero?</h2>

          <p class="lead">
            Non c'è una risposta giusta. Racconta semplicemente cosa è successo
            rispetto a quello che avevi immaginato.
          </p>

          <div class="option-list" id="realityOptions">

            <button class="option-btn" onclick="selectReality('yes')">
              È successo come avevo immaginato
            </button>

            <button class="option-btn" onclick="selectReality('different')">
              È successo, ma in modo diverso
            </button>

            <button class="option-btn" onclick="selectReality('no')">
              Non è successo
            </button>

            <button class="option-btn" onclick="selectReality('unexpected')">
              È successo qualcosa che non avevo previsto
            </button>

            <button class="option-btn" onclick="selectReality('waiting')">
              Non è ancora successo niente
            </button>

          </div>

          <div id="realityTextBox" class="hidden" style="margin-top:20px;">
            <label>Raccontaci cosa è successo</label>
            <textarea id="realityText"
                      maxlength="1800"
                      placeholder="Puoi raccontare anche solo le cose importanti."></textarea>

            <div class="actions">
              <button class="btn btn-secondary" onclick="renderSavedExperience(exp.id)">
                Annulla
              </button>
              <button class="btn btn-primary" onclick="saveRealityUpdate()">
                Aggiorna la mia storia
              </button>
            </div>
          </div>

        </div>

      </div>
    </section>
  `;
}

let selectedRealityValue=null;

function selectReality(value){

  selectedRealityValue=value;

  document.querySelectorAll("#realityOptions .option-btn")
    .forEach((btn,i)=>{
      const values=["yes","different","no","unexpected","waiting"];
      btn.classList.toggle("selected",values[i]===value);
    });

  document.getElementById("realityTextBox").classList.remove("hidden");
  document.getElementById("realityText").focus();
}

function saveRealityUpdate(){

  const exp=appData.experiences.find(e=>e.id===current.experienceId);
  if(!exp) return;

  const text=document.getElementById("realityText").value.trim();

  if(!selectedRealityValue){
    toast("Scegli cosa è successo.");
    return;
  }

  if(!text){
    toast("Raccontaci almeno qualche parola su quello che è successo.");
    return;
  }

  const labels={
    yes:"È successo come immaginato",
    different:"È successo in modo diverso",
    no:"Non è successo",
    unexpected:"È successo qualcosa di imprevisto",
    waiting:"Non è ancora successo"
  };

  exp.updates=exp.updates || [];

  exp.updates.push({
    date:new Date().toISOString(),
    kind:"reality",
    result:selectedRealityValue,
    label:labels[selectedRealityValue],
    text
  });

  exp.updatedAt=new Date().toISOString();

  if(selectedRealityValue!=="waiting"){
    exp.stage=3;
  }

  saveData();

  selectedRealityValue=null;

  renderRealityResult(exp);
}

function renderRealityResult(exp){

  const update=exp.updates[exp.updates.length-1];

  const comparison=buildComparison(exp,update);

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="story">

          <div class="story-cover">
            <div class="eyebrow">AGGIORNAMENTO REGISTRATO</div>
            <h2>La storia è cambiata.</h2>
            <p>
              Da questo momento il percorso può continuare partendo da ciò che è realmente successo.
            </p>
          </div>

          <div class="story-block">
            <div class="story-label">Hai raccontato</div>
            <h3>${escapeHTML(update.label)}</h3>
            <p>${escapeHTML(update.text)}</p>
          </div>

          ${comparison}

          <div class="story-block">
            <div class="story-label">Il prossimo capitolo</div>
            <h3>
              La previsione precedente non è un destino.
            </h3>
            <p>
              Ora abbiamo un'informazione nuova: ciò che è successo davvero.
              Il prossimo percorso deve partire da qui.
            </p>

            <button class="btn btn-primary" onclick="continueAfterReality('${exp.id}')">
              Continua la storia →
            </button>
          </div>

        </div>

      </div>
    </section>
  `;
}

function buildComparison(exp,update){

  const selected=exp.data.scenarios?.[exp.data.selectedScenario];

  if(!selected) return "";

  return `
    <div class="story-block">
      <div class="story-label">Immaginato / Reale</div>

      <div class="compare">
        <div>
          <strong>Quello che avevamo immaginato</strong>
          <p>${escapeHTML(selected.text?.[0] || "Una possibile evoluzione.")}</p>
        </div>

        <div>
          <strong>Quello che è successo</strong>
          <p>${escapeHTML(update.text)}</p>
        </div>
      </div>
    </div>
  `;
}

function continueAfterReality(id){

  const exp=appData.experiences.find(e=>e.id===id);
  if(!exp) return;

  const latest=exp.updates[exp.updates.length-1];

  let newText="";

  if(latest.result==="yes"){
    newText=`La realtà ha seguito una direzione vicina a quella immaginata. Questo però non significa che la storia sia conclusa. Ora la domanda cambia: cosa succede dopo?`;
  }else if(latest.result==="different"){
    newText=`La realtà ha preso una strada diversa. Ed è proprio questa differenza a rendere il nuovo capitolo più interessante: ora la storia può essere costruita a partire da ciò che è realmente accaduto.`;
  }else if(latest.result==="no"){
    newText=`La possibilità non si è trasformata in realtà. Ma il fatto che tu sia tornato/a a raccontarlo ci dice che quella scelta ha ancora una storia da raccontare, oppure che qualcosa dentro di te è cambiato.`;
  }else if(latest.result==="unexpected"){
    newText=`È successo qualcosa che il primo scenario non aveva previsto. Da qui in avanti non ha senso continuare il vecchio copione: il nuovo capitolo deve partire proprio da questo imprevisto.`;
  }else{
    newText=`Non è ancora successo. E va bene così. La storia rimane aperta e potrai aggiornarla quando avrai qualcosa di nuovo da raccontare.`;
  }

  exp.data.currentRealityNarrative=newText;
  exp.updatedAt=new Date().toISOString();

  saveData();

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="story">

          <div class="story-cover">
            <div class="eyebrow">NUOVO CAPITOLO</div>
            <h2>Da qui in poi.</h2>
            <p>
              La storia precedente appartiene a ciò che immaginavi.
              Questa parte appartiene a ciò che sai.
            </p>
          </div>

          <div class="story-block">
            <div class="story-label">La nuova situazione</div>
            <p>${escapeHTML(newText)}</p>
          </div>

          <div class="story-block">
            <div class="story-label">Non è finita</div>
            <h3>Puoi tornare quando vuoi.</h3>
            <p>
              Tra qualche giorno, tra due mesi o tra un anno.
              La prossima volta non dovrai ricominciare da capo:
              continueremo da ciò che è successo oggi.
            </p>

            <div class="hero-actions">
              <button class="btn btn-primary" onclick="renderSavedExperience('${id}')">
                Vedi la mia storia
              </button>

              <button class="btn btn-secondary" onclick="showSaved()">
                Le mie esperienze
              </button>
            </div>
          </div>

        </div>

      </div>
    </section>
  `;
}

function showSaved(){

  const list=appData.experiences
    .slice()
    .sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="section-title">
          <div class="eyebrow">Il tuo percorso</div>
          <h2>Le mie esperienze</h2>
          <p class="lead">
            Qui rimangono le storie che hai iniziato.
          </p>
        </div>

        ${
          list.length
          ?
          `<div class="experience-list">
            ${list.map(e=>`
              <div class="saved-exp">
                <div class="saved-exp-info">
                  <strong>${escapeHTML(experienceName(e.type))}</strong>
                  <span>${escapeHTML(e.title)} · aggiornata ${formatDate(e.updatedAt)}</span>
                </div>

                <button class="btn btn-primary" onclick="openSavedExperience('${e.id}')">
                  Continua
                </button>
              </div>
            `).join("")}
          </div>`
          :
          `<div class="card empty">
            <h3>Ancora nessuna esperienza.</h3>
            <p>La prima storia può iniziare adesso.</p>
            <button class="btn btn-primary" onclick="startEntry()" style="margin-top:20px;">
              Inizia un'esperienza
            </button>
          </div>`
        }

        <div class="section">
          <button class="btn btn-secondary" onclick="goHome()">← Home</button>
        </div>

      </div>
    </section>
  `;
}

function openSavedExperience(id){
  const exp=appData.experiences.find(e=>e.id===id);
  if(!exp) return;

  current.experienceId=id;

  renderSavedExperience(id);
}

function renderSavedExperience(id){

  const exp=appData.experiences.find(e=>e.id===id);
  if(!exp) return;

  if(exp.type==="adesso"){
    renderSavedAdesso(exp);
    return;
  }

  const selectedIndex=exp.data.selectedScenario;

  if(selectedIndex!==undefined && exp.stage>=1){
    renderContinuation(exp);
  }else{
    renderStory(exp);
  }
}

function renderSavedAdesso(exp){

  document.getElementById("main").innerHTML=`
    <section class="screen">
      <div class="container">

        <div class="story">

          <div class="story-cover">
            <div class="eyebrow">E ADESSO?</div>
            <h2>${escapeHTML(exp.title)}</h2>
            <p>Ultimo aggiornamento: ${formatDate(exp.updatedAt)}</p>
          </div>

          <div class="story-block">
            <div class="story-label">La situazione iniziale</div>
            <p>${escapeHTML(exp.data.prompt)}</p>
          </div>

          ${
            exp.data.currentRealityNarrative
            ?
            `<div class="story-block">
              <div class="story-label">Dove siamo adesso</div>
              <p>${escapeHTML(exp.data.currentRealityNarrative)}</p>
            </div>`
            :
            ""
          }

          <div class="story-block">
            <div class="story-label">Possibile evoluzione</div>

            <div class="timeline">
              ${exp.data.timeline.map(item=>`
                <div class="timeline-item">
                  <span class="timeline-dot"></span>
                  <h4>${escapeHTML(item.time)}</h4>
                  <p>${escapeHTML(item.text)}</p>
                </div>
              `).join("")}
            </div>
          </div>

          ${
            exp.updates?.length
            ?
            `<div class="story-block">
              <div class="story-label">Gli aggiornamenti</div>
              ${exp.updates.map(u=>`
                <div class="future-row">
                  <strong>${formatDate(u.date)}</strong>
                  <p>${escapeHTML(u.text)}</p>
                </div>
              `).join("")}
            </div>`
            :
            ""
          }

          <div class="story-block">
            <div class="story-label">Continua</div>
            <p>
              La situazione è cambiata? Hai scoperto qualcosa?
              Torna qui e aggiorna la storia.
            </p>

            <button class="btn btn-primary" onclick="updateExperience('${exp.id}')">
              Racconta cosa è successo
            </button>
          </div>

        </div>

      </div>
    </section>
  `;
}

function formatDate(date){
  try{
    return new Intl.DateTimeFormat("it-IT",{
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }).format(new Date(date));
  }catch(e){
    return "";
  }
}

/* Chiudi modal cliccando fuori */
document.getElementById("modal").addEventListener("click",function(e){
  if(e.target===this) closeModal();
});

/* Avvio */
renderHome();

/* =========================================================
   FUNZIONI DI UTILITÀ
========================================================= */

window.addEventListener("beforeunload",saveData);

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    closeModal();
  }
});
</script>

</body>
