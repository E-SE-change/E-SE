<script>
/* =========================================================
   E SE? V10.4 DEFINITIVO (CONFRONTO NEUTRALE APPROFONDITO)
   ========================================================= */

const K={
  p:"ese_profile",
  l:"ese_saved_lives",
  n:"ese_now_sessions",
  t:"ese_two_sessions"
};

let data={
  profile:null,
  lifeAnswers:[],
  lives:[],
  currentLife:null,
  currentEvent:null,
  now:null,
  two:null
};

function load(){
  try{
    data.profile=JSON.parse(localStorage.getItem(K.p)||"null");
  }catch(e){}

  try{
    data.lives=JSON.parse(localStorage.getItem(K.l)||"[]");
  }catch(e){
    data.lives=[];
  }

  try{
    data.two=JSON.parse(localStorage.getItem(K.t)||"null");
  }catch(e){}

  try{
    data.now=JSON.parse(localStorage.getItem(K.n)||"null");
  }catch(e){}
}

function saveAll(){
  localStorage.setItem(K.p,JSON.stringify(data.profile));
  localStorage.setItem(K.l,JSON.stringify(data.lives));
  localStorage.setItem(K.t,JSON.stringify(data.two));
  localStorage.setItem(K.n,JSON.stringify(data.now));
}

function app(html){
  document.getElementById("app").innerHTML=html;
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   PROFILO
   ========================================================= */

function profilePage(){

  const p=data.profile||{};

  app(`
    <div class="nav">
      <button class="btn" onclick="home()">← Home</button>
    </div>

    <div class="card">
      <h2 class="section-title">👤 Il tuo profilo</h2>
      <p class="muted">
        Queste informazioni servono a rendere la storia più vicina
        alla persona che sei.
      </p>

      <label>Nome</label>
      <input id="pn" value="${esc(p.name||"")}" placeholder="Come ti chiami?">

      <label>Età</label>
      <input id="pa" type="number" value="${esc(p.age||"")}" placeholder="Età">

      <label>Segno zodiacale</label>
      <select id="pz">
        <option value="">Seleziona</option>
        ${[
          "Ariete","Toro","Gemelli","Cancro","Leone","Vergine",
          "Bilancia","Scorpione","Sagittario","Capricorno","Acquario","Pesci"
        ].map(z=>`<option ${p.zodiac===z?"selected":""}>${z}</option>`).join("")}
      </select>

      <label>Situazione sentimentale</label>
      <select id="pr">
        <option value="">Seleziona</option>
        ${["Single","Frequento qualcuno","Fidanzato/a","Convivente","Sposato/a","Separato/a","Divorziato/a","È complicato"].map(x=>`
          <option ${p.rel===x?"selected":""}>${x}</option>
        `).join("")}
      </select>

      <label>Raccontami qualcosa di te</label>
      <textarea id="pd" placeholder="Come sei? Cosa desideri? Cosa ti preoccupa?">${esc(p.desc||"")}</textarea>

      <button class="btn primary" onclick="saveProfile()">Salva profilo</button>
      <button class="btn red" onclick="clearData()">Cancella dati</button>
    </div>
  `);
}

function saveProfile(){

  data.profile={
    name:document.getElementById("pn").value.trim(),
    age:document.getElementById("pa").value.trim(),
    zodiac:document.getElementById("pz").value,
    rel:document.getElementById("pr").value,
    desc:document.getElementById("pd").value.trim()
  };

  saveAll();

  app(`
    <div class="card center">
      <h2>✨ Profilo salvato</h2>
      <p class="muted">
        Ora possiamo usarlo per rendere le storie più personali.
      </p>
      <button class="btn primary" onclick="home()">Continua</button>
    </div>
  `);
}

function clearData(){

  if(confirm("Vuoi cancellare tutti i dati salvati?")){
    localStorage.removeItem(K.p);
    localStorage.removeItem(K.l);
    localStorage.removeItem(K.n);
    localStorage.removeItem(K.t);
    data={
      profile:null,
      lifeAnswers:[],
      lives:[],
      currentLife:null,
      currentEvent:null,
      now:null,
      two:null
    };
    showIntro();
  }
}


/* =========================================================
   E SE? INDIVIDUALE
   ========================================================= */

const Q=[
  {
    type:"choice",
    key:"change",
    text:"Quanto senti che la tua vita sia pronta a cambiare?",
    options:[
      "Molto: sento che qualcosa sta per cambiare",
      "Abbastanza: vorrei cambiare ma non so da dove partire",
      "Poco: preferisco la stabilità",
      "Non lo so ancora"
    ]
  },
  {
    type:"choice",
    key:"risk",
    text:"Quando arriva un'opportunità importante, cosa fai più spesso?",
    options:[
      "Mi butto",
      "Valuto e poi decido",
      "Aspetto prima di fidarmi",
      "La lascio andare se mi spaventa troppo"
    ]
  },
  {
    type:"open",
    key:"desire",
    text:"Qual è la cosa che desideri davvero ottenere nei prossimi anni?"
  },
  {
    type:"open",
    key:"fear",
    text:"Qual è la paura che senti possa ostacolarti di più?"
  },
  {
    type:"choice",
    key:"people",
    text:"Quanto contano le altre persone nelle tue decisioni?",
    options:[
      "Molto",
      "Abbastanza",
      "Poco",
      "Dipende dalla situazione"
    ]
  },
  {
    type:"open",
    key:"relationship",
    text:"Che tipo di relazione o legame vorresti costruire o vivere?"
  },
  {
    type:"open",
    key:"work",
    text:"Che cambiamento vorresti vedere nel lavoro o nella tua vita economica?"
  },
  {
    type:"choice",
    key:"priority",
    text:"Quale area vorresti trasformare per prima?",
    options:[
      "Amore",
      "Lavoro e denaro",
      "Casa e famiglia",
      "Me stessa/o",
      "Tutto insieme"
    ]
  },
  {
    type:"open",
    key:"turning",
    text:"Se potessi cambiare una sola decisione del passato, quale sarebbe?"
  },
  {
    type:"open",
    key:"future",
    text:"Immagina di incontrare te stessa/o tra cinque anni: cosa vorresti sentirti dire?"
  }
];

function startLife(){

  if(!data.profile){
    profilePage();
    return;
  }

  data.lifeAnswers=[];
  renderLQ(0);
}

function renderLQ(i){

  const q=Q[i];

  let content="";

  if(q.type==="choice"){
    content=q.options.map((o,n)=>`
      <button class="choice" onclick="LA(${i},${n})">
        ${esc(o)}
      </button>
    `).join("");
  }else{
    content=`
      <textarea id="lifeOpen" placeholder="Scrivi liberamente..."></textarea>
      <button class="btn primary" onclick="LA(${i},document.getElementById('lifeOpen').value)">Continua</button>
    `;
  }

  app(`
    <div class="nav">
      <button class="btn" onclick="home()">← Esci</button>
      <span class="badge">${i+1} / ${Q.length}</span>
    </div>

    <div class="card">
      <h2>🔮 ${esc(q.text)}</h2>
      ${content}
    </div>
  `);
}

function LA(i,a){

  data.lifeAnswers[i]=a;
  nextLQ(i);
}

function nextLQ(i){

  if(i+1<Q.length){
    renderLQ(i+1);
  }else{
    buildLives();
  }
}


/* =========================================================
   MOTORE NARRATIVO INDIVIDUALE
   ========================================================= */

function buildLives(){

  const p=data.profile||{};

  const desire=data.lifeAnswers[2]||"qualcosa di importante";

  const future=data.lifeAnswers[9]||"un futuro più vicino a ciò che desidera";

  const name=p.name||"Tu";

  data.lives=[
    {
      id:Date.now()+"-1",
      title:"🟢 Vita 1 — La strada che scegli",

          year:1,

          prediction:true
        },
        {
          year:1,
          title:"Una conseguenza inattesa",
          text:`La scelta porta anche una conseguenza: devi confrontarti con ${fear}. Non puoi più rimandare una decisione.`,

        },
        {
          year:1,

          prediction:true
        },
        {
          year:3,
          title:"La seconda svolta",
          text:`Dopo tre anni guardi indietro e capisci che la prima scelta ha modificato anche il modo in cui vivi ${work}. Arriva una possibilità che richiede coraggio.`,
          prediction:true

        {
          year:3,
          title:"Quello che lasci indietro",
          text:`Per continuare devi rinunciare a qualcosa. Non necessariamente una persona: potrebbe essere un'abitudine, una paura o una vecchia versione di te.`,
          prediction:true
        },
        {
          year:5,
          title:"Il risultato",
          text:`Dopo cinque anni il desiderio iniziale non appare più uguale. È diventato qualcosa di concreto e più grande di come lo immaginavi.`,
          prediction:true
        },
        {
          year:5,
          title:"L'incontro con il tuo futuro",
          text:`Riconosci parte di ${future} nella persona che sei diventata.`,
          prediction:true

      ]

    {
      id:Date.now()+"-2",
      title:"🔵 Vita 2 — La strada che non scegli",
      intro:`Questa è la possibilità che nasce dalla direzione alternativa: quella che avresti potuto prendere.`,
      events:[
        {
          year:1,
          title:"Il bivio rimasto aperto",
          text:`Una possibilità rimane nella tua mente. La scelta diversa avrebbe richiesto di affrontare ${fear} in modo più diretto.`,
          prediction:true
        },
        {
          year:1,
          title:"La nuova occasione",
          text:`Qualcosa arriva comunque nella tua vita e ti costringe a chiederti se la decisione presa sia davvero definitiva.`,
          prediction:true
        },
        {
          year:1,
          title:"Un incontro importante",
          text:`Una persona o una situazione modifica la tua prospettiva su ${relation}.`,
          prediction:true

        {
          year:3,
          title:"Una versione diversa di te",
          text:`A tre anni ti trovi a vivere una realtà diversa da quella immaginata all'iniziale.`,
          prediction:true
        },
        {
          year:3,
          title:"La scelta che ritorna",
          text:`Una decisione collegata a ${turning} torna simbolicamente nella tua vita.`,
          prediction:true
        },

function check(li,ei,status){

  const e=data.lives[li].events[ei];

  if(!e.reality)e.reality={};

  e.reality.status=status;

  data.lives[li].events[ei]=e;

  saveAll();

  const labels={
    yes:"🟢 È successo",
    partial:"🟡 È successo qualcosa di simile",
    no:"⚪ Non è successo",
    different:"🔵 È successo qualcosa di completamente diverso"
  };

  const box=document.getElementById("realityText");

  if(box){
    box.insertAdjacentHTML(
      "beforebegin",
      `<div class="status">${labels[status]}</div>`
    );
  }
}

function continueFromReality(li,ei){

  const l=data.lives[li];
  const e=l.events[ei];
  const text=(document.getElementById("realityText")?.value||"").trim();

function openTwoVerification(li,ei){

  const e=data.two.lives[li].events[ei];

  const old=e.reality||{};

  app(`
    <div class="nav">
      <button class="btn" onclick="openTwoLife(${li})">← Storia</button>
    </div>

    <div class="card">

      <span class="badge">
        ${e.year===0?"Situazione iniziale":"Anno "+e.year}
      </span>

      <h2>${esc(e.title)}</h2>

      <p>${esc(e.text)}</p>

    </div>

    <div class="card">

      <h3>🔎 Che cosa è successo davvero?</h3>

      <button class="choice" onclick="checkTwo(${li},${ei},'yes')">
        🟢 È successo
      </button>

      <button class="choice" onclick="checkTwo(${li},${ei},'partial')">
        🟡 È successo qualcosa di simile
      </button>

      <button class="choice" onclick="checkTwo(${li},${ei},'no')">
        ⚪ Non è successo
      </button>

      <button class="choice" onclick="checkTwo(${li},${ei},'different')">
        🔵 È successo qualcosa di completamente diverso
      </button>

      <hr>

      <label>
        Raccontate cosa è successo realmente
      </label>

      <textarea id="twoReality">${esc(old.text||"")}</textarea>

      <button class="btn green" onclick="continueTwoReality(${li},${ei})">
        ✨ Continua la vostra storia da qui
      </button>

    </div>
  `);
}

function checkTwo(li,ei,status){

  const e=data.two.lives[li].events[ei];

  if(!e.reality)e.reality={};

  e.reality.status=status;

  data.two.lives[li].events[ei]=e;

  saveAll();

  const labels={
    yes:"🟢 È successo",
    partial:"🟡 È successo qualcosa di simile",
    no:"⚪ Non è successo",
    different:"🔵 È successo qualcosa di completamente diverso"
  };

  const box=document.getElementById("twoReality");

  if(box){
    box.insertAdjacentHTML(
      "beforebegin",
      `<div class="status">${labels[status]}</div>`
    );
  }
}

function continueTwoReality(li,ei){

  const l=data.two.lives[li];
  const e=l.events[ei];

  const text=(document.getElementById("twoReality")?.value||"").trim();

  if(!text){
    alert("Raccontate prima cosa è successo realmente.");
    return;
  }

  if(!e.reality)e.reality={};

  e.reality.text=text;

  const A=data.two.personA;
  const B=data.two.personB;

  const branch={
    id:Date.now()+"-two-reality",
    title:"🌱 La vostra storia reale",
    intro:`Da questo momento la storia non parte più da una previsione: parte da ciò che è realmente successo a ${A.name||"Persona A"} e ${B.name||"Persona B"}.`,
    realityOrigin:true,
    sourceLife:l.title,
    sourceEvent:e.title,
    reality:text,

    events:[
      {
        year:e.year,
        title:"Il punto reale",
        text:`Quello che è successo realmente: ${text}`,
        prediction:false
      },
      {
        year:e.year,
        title:"La conseguenza per entrambi",
        text:`Ciò che è successo modifica contemporaneamente la traiettoria di ${A.name||"Persona A"} e ${B.name||"Persona B"}.`,
        prediction:false
      },
      {
        year:e.year+1,
        title:"La nuova decisione",
        text:`La realtà vissuta crea una nuova scelta che dovrete affrontare insieme.`,
        prediction:true
      },
      {
        year:3,
        title:"Il nuovo equilibrio",
        text:`Le vostre esigenze, paure e desideri vengono nuovamente messi in relazione con ciò che è realmente accaduto.`,
        prediction:true
      },
      {
        year:5,
        title:"La traiettoria che nasce dalla realtà",
        text:`Questa volta il futuro non parte dalla previsione iniziale, ma dalla vostra esperienza reale.`,
        prediction:true
      }
    ]
  };

  data.two.lives.push(branch);

  saveAll();

  app(`
    <div class="card center">

      <h2>🌱 La vostra storia continua</h2>

      <p>
        Quello che è successo davvero è diventato
        il nuovo punto di partenza della vostra storia.
      </p>

      <button class="btn blue" onclick="openTwoLife(${data.two.lives.length-1})">
        Continua la nuova traiettoria
      </button>

      <button class="btn purple" onclick="twoPredictions()">
        Le vostre previsioni
      </button>

    </div>
  `);
}

}

const NQ=[
  "Che cosa sta succedendo nella tua vita in questo momento?",
  "Qual è la cosa che ti pesa maggiormente?",
  "Quale risultato vorresti ottenere per primo?",
  "Cosa potresti fare concretamente già nei prossimi giorni?",
  "Qual è la decisione che continui a rimandare?"
];

function renderNowQ(i){

  if(i>=NQ.length){
    finishNow();
    return;
  }

  app(`
    <div class="nav">
      <button class="btn" onclick="home()">← Home</button>
      <span class="badge">${i+1} / ${NQ.length}</span>
    </div>

    <div class="card">
      <h2>⚡ ${esc(NQ[i])}</h2>

      <textarea id="nowAnswer" placeholder="Scrivi liberamente..."></textarea>

      <button class="btn orange" onclick="NA(${i})">
        Continua
      </button>
    </div>
  `);
}

function NA(i){

  data.now.answers[i]=document.getElementById("nowAnswer").value.trim();

  renderNowQ(i+1);
}

function finishNow(){

  data.now.result={

    weight:a[1],

    action:a[3],
    decision:a[4]
  };

  saveAll();

  app(`
    <div class="card">

        Non serve risolvere tutto contemporaneamente.
