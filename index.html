<body>

<div id="app" class="app"></div>

<script>
"use strict";

/* =========================================================
   E SE? — CORE APPLICATION
   ========================================================= */

const STORAGE_KEY = "ese_app_v1";

const defaultState = {
  profile:{
    name:"",
    age:"",
    info:"",
    goals:""
  },
  simulations:[],
  realityChecks:[],
  current:null
};

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(defaultState);

    const parsed = JSON.parse(raw);

    return {
      ...structuredClone(defaultState),
      ...parsed,
      profile:{
        ...defaultState.profile,
        ...(parsed.profile || {})
      },
      simulations:Array.isArray(parsed.simulations) ? parsed.simulations : [],
      realityChecks:Array.isArray(parsed.realityChecks) ? parsed.realityChecks : []
    };
  }catch(e){
    return structuredClone(defaultState);
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

function uid(){
  return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9);
}

function escapeHTML(value){
  const div=document.createElement("div");
  div.textContent=String(value ?? "");
  return div.innerHTML;
}

function today(){
  return new Date().toLocaleDateString("it-IT");
}

function normalize(text){
  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function contains(text,words){
  const t=normalize(text);
  return words.some(w=>t.includes(normalize(w)));
}

function random(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function app(){
  return document.getElementById("app");
}

function render(html){
  app().innerHTML=html;
  window.scrollTo({top:0,behavior:"smooth"});
}

function layout(content,active=""){
  return `
  <header>
    <div class="container nav">
      <button class="logo" onclick="goHome()">E<span>SE?</span></button>

      <div class="nav-actions">
        <button class="nav-btn" onclick="startSolo()">🔮 E SE?</button>
        <button class="nav-btn" onclick="startCouple()">❤️ In 2</button>
        <button class="nav-btn" onclick="startNow()">💭 E ADESSO?</button>
        <button class="nav-btn" onclick="showProfile()">👤 Profilo</button>
      </div>
    </div>
  </header>

  <main>
    ${content}
  </main>

  <footer>
    <div class="container">
      <div class="footer-links">
        <button onclick="showLegal('privacy')">Privacy</button>
        <button onclick="showLegal('terms')">Termini</button>
        <button onclick="showLegal('notice')">Avviso</button>
        <button onclick="showPredictions()">🔮 Le mie previsioni</button>
      </div>
      <p>© ${new Date().getFullYear()} E SE? — Prova una vita prima di viverla.</p>
    </div>
  </footer>
  `;
}

/* =========================================================
   HOME
   ========================================================= */

function goHome(){
  render(layout(`
    <section class="hero container">
      <div class="hero-badge">✨ Un'esperienza narrativa interattiva</div>

      <h1><span>E SE?</span></h1>

      <p>
        E se potessi esplorare una possibile versione della tua vita
        prima di viverla?
      </p>

      <p class="hero-tagline">
        Prova una vita prima di viverla.
      </p>

      <div class="cta">
        <button class="btn btn-primary" onclick="startSolo()">🔮 Inizia E SE?</button>
        <button class="btn btn-secondary" onclick="startNow()">💭 Cosa succede adesso?</button>
      </div>
    </section>

    <section class="section container">
      <div class="cards">

        <article class="card experience-card">
          <div class="experience-icon">🔮</div>
          <h3>E SE? — Da soli</h3>
          <p>
            Racconta una scelta, un desiderio o una possibilità.
            Le tue risposte costruiranno tre possibili strade della tua vita,
            con sviluppi a 1, 3 e 5 anni.
          </p>
          <button class="btn btn-primary" onclick="startSolo()">Esplora una possibilità</button>
        </article>

        <article class="card experience-card">
          <div class="experience-icon">❤️</div>
          <h3>E SE? — In 2</h3>
          <p>
            Due persone, due punti di vista e una storia condivisa.
            Le decisioni di una persona possono cambiare la traiettoria dell'altra.
          </p>
          <button class="btn btn-primary" onclick="startCouple()">Esplora insieme</button>
        </article>

        <article class="card experience-card">
          <div class="experience-icon">💭</div>
          <h3>E ADESSO?</h3>
          <p>
            Non devi prima fare una simulazione.
            Racconta semplicemente cosa sta succedendo adesso e
            prova a esplorare cosa potrebbe accadere se agisci, aspetti,
            lasci andare o se arriva un imprevisto.
          </p>
          <button class="btn btn-primary" onclick="startNow()">Parti da adesso</button>
        </article>

      </div>
    </section>

    <section class="section container">
      <div class="page-header">
        <h2 class="section-title">Come funziona?</h2>
        <p class="section-subtitle">
          Non scegli semplicemente una risposta: costruisci una storia.
        </p>
      </div>

      <div class="info-grid">
        <div class="info-box">
          <h3>🧠 Le tue risposte contano</h3>
          <p>
            Le domande cambiano in base a quello che racconti.
            Le risposte modificano concretamente i parametri della simulazione,
            gli eventi e le conseguenze.
          </p>
        </div>

        <div class="info-box">
          <h3>🔮 Tre vite</h3>
          <p>
            Esplora la strada che scegli, quella che non scegli

          </p>
        </div>

        <div class="info-box">
          <h3>📖 1 · 3 · 5 anni</h3>
          <p>
            Ogni percorso evolve nel tempo.
            Gli eventi non sono tre testi indipendenti:
            quello che succede prima influenza ciò che viene dopo.
          </p>
        </div>

        <div class="info-box">
          <h3>🔄 Previsione → Realtà</h3>
          <p>
            Puoi tornare mesi o anni dopo e raccontare cosa è realmente
            successo. La tua storia non finisce quando termina la simulazione.
          </p>
        </div>
      </div>
    </section>

    <section class="section container">
      <div class="card">
        <h2 class="section-title">Non è una previsione del futuro.</h2>
        <p class="section-subtitle">
          E SE? crea scenari narrativi ipotetici basati sulle informazioni
          e sulle risposte che fornisci. Non può sapere cosa accadrà realmente
          e non ti dice quale scelta dovresti fare.
        </p>
      </div>
    </section>

    <div class="ad-wrap">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-7154454592714745"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
  `));

/* =========================================================
   ADSENSE
   ========================================================= */

function activateAds(){
  try{
    if(window.adsbygoogle){
      (window.adsbygoogle=window.adsbygoogle||[]).push({});
    }
  }catch(e){}
}

/* =========================================================
   PROFILE
   ========================================================= */

function showProfile(){
  render(layout(`

  // Detect initial topic to personalize questions.
  const t=normalize(text);

  if(contains(t,["lavoro","azienda","ufficio","stipendio","carriera","licenzi","dimission","impiego"])){
    state.current.answers.detectedTopic="work";
  }else if(contains(t,["amore","fidanz","marito","moglie","ragazzo","ragazza","relazione","persona","messaggio"])){
    state.current.answers.detectedTopic="love";
  }else if(contains(t,["casa","trasfer","citta","partire","vivere"])){
    state.current.answers.detectedTopic="home";
  }else if(contains(t,["soldi","denaro","debito","finanzi","progetto","attivita"])){
    state.current.answers.detectedTopic="money";
  }else{
    state.current.answers.detectedTopic="self";

  state.current.step=0;
  renderSoloQuestion();
}

function scoreFromAnswers(answers){
  const score={
    risk:0,
    stability:0,
    freedom:0,
    relationships:0,
    growth:0,
    fear:0
  };

  const riskMap={
    low:["stability",2],
    medium:["stability",1],
    high:["risk",2]
  };

  if(riskMap[answers.risk]){
    score[riskMap[answers.risk][0]]+=riskMap[answers.risk][1];
  }

  if(answers.priority==="security") score.stability+=3;
  if(answers.priority==="freedom") score.freedom+=3;
  if(answers.priority==="people") score.relationships+=3;
  if(answers.priority==="growth") score.growth+=3;

  if(answers.futureFeeling==="safe") score.stability+=2;
  if(answers.futureFeeling==="changed") score.freedom+=2;
  if(answers.futureFeeling==="people") score.relationships+=2;
  if(answers.futureFeeling==="proud") score.growth+=2;

  if(answers.fear==="failure") score.fear=3;
  if(answers.fear==="loss") score.fear=2;
  if(answers.fear==="regret") score.fear=1;
  if(answers.fear==="unknown") score.fear=2;

  return score;
}

function detectTopicFromCurrent(current){
  return current.answers.detectedTopic || "self";
}

function createScenario(label,type,current,score){
  const topic=detectTopicFromCurrent(current);
  const lib=eventLibrary[topic] || eventLibrary.self;

  let baseScore={...score};

  if(type==="chosen"){
    baseScore.freedom+=1;
    baseScore.growth+=1;
  }

  if(type==="safe"){
    baseScore.stability+=2;
  }

  if(type==="third"){
    baseScore.freedom+=1;
    baseScore.growth+=1;
    baseScore.risk+=1;
  }

  const risk=baseScore.risk;
  const stability=baseScore.stability;
  const fear=baseScore.fear;

  let start=random(lib.start);
  let opportunity=random(lib.opportunity);
  let difficulty=random(lib.difficulty);
  let surprise=random(lib.surprise);

  if(type==="safe"){
    start=lib.start[0];
    difficulty=lib.difficulty[1];
  }

  if(type==="third"){
    start=lib.surprise[Math.floor(Math.random()*lib.surprise.length)];
  }

  const years=[];

  let year1Events=[
    {
      title:"Il primo passo",
      text:start,
      type:"Svolta iniziale"
    }
  ];

  if(stability>=3){
    year1Events.push({
      title:"La ricerca di equilibrio",
      text:"Cerchi di costruire il cambiamento senza perdere completamente le sicurezze che per te contano.",
      type:"Conseguenza"
    });
  }else{
    year1Events.push({
      title:"Una nuova direzione",
      text:"La scelta modifica alcune delle tue abitudini e ti costringe a capire cosa vuoi davvero mantenere.",
      type:"Conseguenza"
    });
  }

  if(fear>=2 && type==="chosen"){
    year1Events.push({
      title:"Il momento del dubbio",
      text:"Arriva una fase in cui ti chiedi se il rischio fosse davvero necessario. Il dubbio non annulla però ciò che hai imparato.",
      type:"Difficoltà"
    });
  }else{
    year1Events.push({
      title:"Una prima opportunità",
      text:opportunity,
      type:"Opportunità"
    });
  }

  years.push({year:1,events:year1Events});

  let year3Events=[
    {
      title:"Una conseguenza inattesa",
      text: difficulty,
      type:"Difficoltà"
    },
    {
      title:"Una nuova possibilità",
      text: opportunity,
      type:"Opportunità"
    }
  ];

  if(type==="third"){
    year3Events.push({
      title:"La terza via prende forma",
      text:"Una soluzione che all'inizio sembrava secondaria diventa progressivamente una strada concreta.",
      type:"Svolta"
    });
  }else{
    year3Events.push({
      title:"Una scelta successiva",
      text:"Quello che è successo nei primi anni ti porta davanti a una nuova decisione che non era presente all'inizio.",
      type:"Evoluzione"
    });
  }

  years.push({year:3,events:year3Events});

  let finalText;

  if(type==="safe"){
    finalText="A cinque anni questa strada tende a costruire soprattutto continuità: alcune cose sono cambiate, ma il filo principale rimane la ricerca di stabilità.";
  }else if(type==="chosen"){
    finalText="A cinque anni il cambiamento iniziale non è più l'evento centrale: sono le conseguenze successive ad aver costruito una situazione nuova.";
  }else{
    finalText="A cinque anni la terza via potrebbe essere diventata una strada autonoma, molto diversa da quella che avevi immaginato all'inizio.";
  }

  years.push({
    year:5,
    events:[
      {
        title:"Dove potrebbe portare",
        text:finalText,
        type:"Evoluzione"
      },
      {
        title:"L'elemento da ricordare",
        text:"La situazione finale nasce dalla somma delle decisioni, degli eventi e delle opportunità incontrate lungo il percorso.",
        type:"Riflessione"
      }
    ]
  });

  return {
    id:uid(),
    label,
    type,
    years
  };
}

function generateSolo(){
  const current=state.current;
  const score=scoreFromAnswers(current.answers);
  const topic=current.answers.detectedTopic || "self";

  const titleMap={
    work:"Il tuo possibile cambiamento professionale",
    love:"La possibilità che riguarda il tuo cuore",
    home:"La strada verso un cambiamento di vita",
    money:"La scelta che riguarda il tuo progetto",
    self:"La possibilità che stai esplorando"
  };

  const scenarios=[
    createScenario("🟢 Quella che scegli","chosen",current,score),
    createScenario("🔵 Quella che non scegli","safe",current,score),
    createScenario("🟣 La terza via","third",current,score)
  ];

  current.title=titleMap[topic];
  current.score=score;
  current.scenarios=scenarios;
  current.generatedAt=new Date().toISOString();

  state.current=current;
  saveState();

  showSimulation(current);
}

function scenarioHTML(s,index){
  const classes=["green","blue","purple"];
  return `
    <article class="scenario ${classes[index]}">
      <span class="scenario-label">${escapeHTML(s.label)}</span>

      <div class="timeline">
        ${s.years.map(y=>`
          <div class="year-card">
            <div class="year">TRA ${y.year} ${y.year===1 ? "ANNO" : "ANNI"}</div>

            ${y.events.map(e=>`
              <div class="event">
                <div class="event-title">${escapeHTML(e.title)}</div>
                <div class="event-text">${escapeHTML(e.text)}</div>
                <span class="event-type">${escapeHTML(e.type)}</span>
              </div>
            `).join("")}
          </div>
        `).join("")}
      </div>
    </article>
  `;
}

function shortYear(s,year){
  const y=s.years.find(x=>x.year===year);
  if(!y) return "";
  return y.events.map(e=>e.text).join(" ");
}

function saveCurrentSimulation(){
  if(!state.current || !state.current.scenarios){
    alert("Non c'è una simulazione da salvare.");
    return;
  }

  const copy=JSON.parse(JSON.stringify(state.current));

  state.simulations.unshift(copy);
  state.current=null;

  saveState();

  render(layout(`
    <section class="page container">
      <div class="card form-card">
        <div class="success">
          ✓ Simulazione salvata in “Le mie previsioni”.

  `));
}

function generateCouple(){
  const c=state.current;
  const topic=contains(
    c.answers.situation+" "+c.profileA.goals+" "+c.profileB.goals,
    ["lavoro","stipendio","carriera","azienda"]
  ) ? "work" :
  contains(
    c.answers.situation+" "+c.profileA.goals+" "+c.profileB.goals,
    ["casa","trasfer","partire","citta"]
  ) ? "home" : "love";

  const score={
    stability:0,
    freedom:0,
    risk:0,
    relationships:3,
    growth:0,
    difference:0
  };

  if(c.answers.commonGoal==="stability") score.stability+=3;
  if(c.answers.commonGoal==="change") score.freedom+=3;
  if(c.answers.commonGoal==="freedom") score.freedom+=3;
  if(c.answers.commonGoal==="growth") score.growth+=3;

  if(c.answers.riskA==="high") score.risk+=2;
  if(c.answers.riskA==="low") score.stability+=2;
  if(c.answers.riskB==="high") score.risk+=2;
  if(c.answers.riskB==="low") score.stability+=2;

  if(c.answers.difference==="different") score.difference=3;
  if(c.answers.difference==="mixed") score.difference=2;
  if(c.answers.difference==="same") score.difference=1;

  const base={
    ...c,
    answers:{...c.answers,detectedTopic:topic}
  };

  function coupleScenario(label,type){
    const lib=eventLibrary[topic]||eventLibrary.love;

    let first=random(lib.start);
    let opportunity=random(lib.opportunity);
    let difficulty=random(lib.difficulty);
    let surprise=random(lib.surprise);

    if(type==="safe"){
      first="La priorità diventa proteggere ciò che già funziona tra voi, cercando comunque di risolvere la questione che vi ha portato qui.";
    }

    if(type==="third"){
      first="Una terza possibilità emerge quando vi rendete conto che la scelta iniziale non deve necessariamente essere un aut-aut.";
    }

    const years=[
      {
        year:1,
        events:[
          {
            title:"Il primo cambiamento",
            text:first,
            type:"Svolta condivisa"
          },
          {
            title:"La dinamica tra voi",
            text:
              score.difference>=3
              ? "Le vostre differenze diventano parte centrale del percorso: ciò che per uno dei due è un'opportunità può essere vissuto dall'altro come una difficoltà."
              : "Il modo in cui affrontate la decisione crea una nuova abitudine nella vostra vita condivisa.",
            type:"Relazione"
          },
          {
            title:"Una possibilità",
            text:opportunity,
            type:"Opportunità"
          }
        ]
      },
      {
        year:3,
        events:[
          {
            title:"Una prova",
            text:difficulty,
            type:"Difficoltà"
          },
          {
            title:"Una decisione nuova",
            text:
              type==="third"
              ? "La soluzione iniziale lascia spazio a un accordo diverso, costruito a partire da ciò che avete imparato insieme."
              : "La scelta iniziale non è più sufficiente da sola: una nuova decisione riapre il percorso.",
            type:"Evoluzione"
          },
          {
            title:"Un evento inatteso",
            text:surprise,
            type:"Imprevisto"
          }
        ]
      },
      {
        year:5,
        events:[
          {
            title:"La vostra traiettoria",
            text:
              type==="safe"
              ? "A cinque anni la vostra storia è costruita soprattutto sulla continuità, ma il problema iniziale ha comunque modificato il modo in cui affrontate le decisioni."
              : type==="chosen"
              ? "A cinque anni la scelta iniziale è diventata solo il punto di partenza di una storia molto più ampia."
              : "A cinque anni la terza via è diventata una strada che all'inizio nessuno dei due aveva immaginato.",
            type:"Evoluzione"
          },
          {
            title:"Ciò che avete costruito",
            text:"La traiettoria condivisa nasce dalle vostre scelte, dalle reazioni reciproche e dagli eventi incontrati lungo il percorso.",
            type:"Riflessione"
          }
        ]
      }
    ];

    return {id:uid(),label,type,years};
  }

  c.title="La vostra possibile storia";
  c.scenarios=[
    coupleScenario("🟢 Quella che scegliete","chosen"),
    coupleScenario("🔵 Quella che non scegliete","safe"),
    coupleScenario("🟣 La terza via","third")
  ];

  c.generatedAt=new Date().toISOString();

  state.current=c;
  saveState();

  showCoupleSimulation(c);
}

      }

    createdAt:new Date().toISOString()
  };

  state.current=result;
  saveState();

  showNowResult(result);
}

function showNowResult(result){
  render(layout(`
    <section class="page container">
      <div class="simulation-header">
        <div class="emoji">💭</div>
        <h1>E ADESSO?</h1>
        <p>
          Quattro possibili direzioni. Nessuna viene indicata come quella giusta.
        </p>
      </div>

      <div class="cards">
        ${result.results.map(r=>`
          <article class="card">
            <div style="font-size:2rem">${r.icon}</div>
            <h2>${escapeHTML(r.title)}</h2>
            <p>${escapeHTML(r.text)}</p>

            <div class="story-block">
              <h4>Possibile sviluppo</h4>
              <p>${escapeHTML(r.event)}</p>
            </div>
          </article>
        `).join("")}
      </div>

      <section class="card" style="margin-top:20px">
        <h2>💌 Se vuoi scrivere a qualcuno</h2>
        <p class="section-subtitle">
          Ecco tre modi diversi per iniziare la conversazione.
        </p>

        <div class="two-col">
          <div class="info-box">
            <h3>💬 Leggero</h3>
            <p>${escapeHTML(generateMessage("light",result))}</p>
          </div>

          <div class="info-box">
            <h3>❤️ Sincero</h3>
            <p>${escapeHTML(generateMessage("honest",result))}</p>
          </div>
        </div>

        <div class="info-box" style="margin-top:16px">
          <h3>🎯 Diretto</h3>
          <p>${escapeHTML(generateMessage("direct",result))}</p>
        </div>
      </section>

      <section class="card" style="margin-top:20px">
        <h2>🔮 Vuoi andare più a fondo?</h2>
        <p class="section-subtitle">
          Puoi trasformare questa situazione in una simulazione E SE?
          e vedere come potrebbe evolversi nel tempo.
        </p>

        <div class="actions">
          <button class="btn btn-primary" onclick="convertNowToSolo()">
            🔮 Trasforma in E SE?
          </button>

          <button class="btn btn-secondary" onclick="saveNowSimulation()">
            💾 Salva
          </button>

          <button class="btn btn-secondary" onclick="startNow()">
            💭 Prova un'altra situazione
          </button>
        </div>
      </section>
    </section>
  `));
}

function generateMessage(style,result){
  const name=state.profile.name || "ciao";

  if(style==="light"){
    return `Ciao ${name}, volevo chiederti una cosa senza farne un dramma. Ti va di parlarne?`;
  }

  if(style==="honest"){
    return `Vorrei dirti una cosa con sincerità. Questa situazione mi sta facendo pensare e mi piacerebbe parlarne con te con calma.`;
  }

  return `Vorrei parlare con te di questa cosa. Per me è importante e preferirei affrontarla apertamente invece di continuare a rimandarla.`;
}

function convertNowToSolo(){
  const now=state.current;

  state.current={
    id:uid(),
    type:"solo",
    step:0,
    answers:{
      detectedTopic:now.answers.topic || "self"
    },
    storyInput:now.story,
    title:"",
    createdAt:new Date().toISOString()
  };

  renderSoloQuestion();
}

function saveNowSimulation(){
  if(!state.current) return;

  const copy=JSON.parse(JSON.stringify(state.current));
  copy.title="E ADESSO? — "+today();

  state.simulations.unshift(copy);
  state.current=null;

  saveState();

  showPredictions();
}

/* =========================================================
   PREDICTIONS / REALITY
   ========================================================= */

function showPredictions(){
  render(layout(`
    <section class="page container">
      <div class="page-header">
        <h1>🔮 Le mie previsioni</h1>
        <p>
          Qui ritrovi le esperienze che hai deciso di salvare.
          Puoi tornare più avanti e confrontarle con la realtà.
        </p>
      </div>

      ${
        state.simulations.length===0
        ? `<div class="card empty">
             Non hai ancora salvato nessuna simulazione.
             <br><br>
             <button class="btn btn-primary" onclick="startSolo()">Inizia E SE?</button>
           </div>`
        : `
          <div class="saved-list">
            ${state.simulations.map((s,index)=>`
              <div class="saved-item">
                <div class="saved-item-info">
                  <strong>${escapeHTML(s.title || "Esperienza senza titolo")}</strong>
                  <span>${escapeHTML(s.type || "")} · ${escapeHTML(formatDate(s.createdAt))}</span>
                </div>

                <div class="actions-right">
                  <button class="btn btn-secondary btn-small"
                    onclick="openSaved(${index})">
                    Apri
                  </button>

                  <button class="btn btn-secondary btn-small"
                    onclick="realityCheck(${index})">
                    🔄 Realtà
                  </button>

                  <button class="btn btn-danger btn-small"
                    onclick="deleteSimulation(${index})">
                    Elimina
                  </button>
                </div>
              </div>
            `).join("")}
          </div>
        `
      }
    </section>
  `));
}

function formatDate(value){
  if(!value) return "";
  try{
    return new Date(value).toLocaleDateString("it-IT");
  }catch(e){
    return "";
  }
}

function openSaved(index){
  const s=state.simulations[index];

  if(s.type==="solo" && s.scenarios){
    showSimulation(s);
    return;
  }

  if(s.type==="couple" && s.scenarios){
    showCoupleSimulation(s);
    return;
  }

  if(s.type==="now" && s.results){
    showNowResult(s);
    return;
  }
}

function deleteSimulation(index){
  if(!confirm("Eliminare questa simulazione?")) return;

  state.simulations.splice(index,1);
  saveState();
  showPredictions();
}

function realityCheck(index){
  const sim=state.simulations[index];

  if(!sim || !sim.scenarios){
    alert("Questa esperienza non contiene previsioni confrontabili.");
    return;
  }

  const events=[];

  sim.scenarios.forEach((scenario,scenarioIndex)=>{
    scenario.years.forEach(year=>{
      year.events.forEach((event,eventIndex)=>{
        events.push({
          key:`${scenario.id}-${year.year}-${eventIndex}`,
          scenarioIndex,
          scenarioLabel:scenario.label,
          year:year.year,
          title:event.title,
          text:event.text
        });
      });
    });
  });

  render(layout(`
    <section class="page container">
      <div class="page-header">
        <span class="badge">PREVISIONE → REALTÀ</span>
        <h1>🔄 Cosa è successo davvero?</h1>
        <p>
          Non devi dimostrare che la simulazione aveva ragione.
          Qui puoi semplicemente raccontare cosa è successo.
        </p>
      </div>

      <div class="reality">
        ${events.map((e,i)=>{
          const existing=getReality(sim.id,e.key);

          return `
            <div class="reality-card">
              <span class="badge">${escapeHTML(e.scenarioLabel)} · ${e.year} ${e.year===1?"anno":"anni"}</span>

              <h3>🔮 ${escapeHTML(e.title)}</h3>

              <p class="section-subtitle">
                ${escapeHTML(e.text)}
              </p>

              <div class="reality-options">
                ${[
                  ["happened","🟢 È successo"],
                  ["similar","🟡 È successo qualcosa di simile"],
                  ["not","⚪ Non è successo"],
                  ["different","🔵 È successo qualcosa di completamente diverso"]
                ].map(o=>`
                  <button
                    class="reality-btn ${existing?.status===o[0]?"selected":""}"
                    onclick="setReality('${escapeHTML(sim.id)}','${escapeHTML(e.key)}','${escapeHTML(o[0])}',this)">
                    ${escapeHTML(o[1])}
                  </button>
                `).join("")}
              </div>

              <textarea
                id="reality-${escapeHTML(e.key)}"
                placeholder="✍️ Racconta cosa è successo davvero...">${escapeHTML(existing?.note || "")}</textarea>

              <button class="btn btn-secondary btn-small"
                style="margin-top:9px"
                onclick="saveRealityNote('${escapeHTML(sim.id)}','${escapeHTML(e.key)}')">
                Salva riflessione
              </button>
            </div>
          `;
        }).join("")}
      </div>

      <button class="btn btn-secondary" onclick="showPredictions()">
        ← Torna alle mie previsioni
      </button>
    </section>
  `));
}

function getReality(simId,eventKey){
  return state.realityChecks.find(x=>x.simId===simId && x.eventKey===eventKey);
}

function setReality(simId,eventKey,status,button){
  let item=getReality(simId,eventKey);

  if(!item){
    item={
      id:uid(),
      simId,
      eventKey,
      status,
      note:"",
      updatedAt:new Date().toISOString()
    };

    state.realityChecks.push(item);
  }else{
    item.status=status;
    item.updatedAt=new Date().toISOString();
  }

  saveState();

  const parent=button.parentElement;

  parent.querySelectorAll(".reality-btn")
    .forEach(b=>b.classList.remove("selected"));

  button.classList.add("selected");
}

function saveRealityNote(simId,eventKey){
  const textarea=document.getElementById("reality-"+eventKey);
  const item=getReality(simId,eventKey);

  if(!item){
    state.realityChecks.push({
      id:uid(),
      simId,
      eventKey,
      status:"not",
      note:textarea.value.trim(),
      updatedAt:new Date().toISOString()
    });
  }else{
    item.note=textarea.value.trim();
    item.updatedAt=new Date().toISOString();
  }

  saveState();

  alert("Riflessione salvata.");
}

/* =========================================================
   SHARING
   ========================================================= */

async function shareSimulation(){
  const sim=state.current;

  if(!sim){
    alert("Salva o apri una simulazione prima di condividerla.");
    return;
  }

  const text=
`🔮 E SE?

${sim.title || "Ho esplorato una possibilità della mia vita."}

Tre strade. Tre possibili sviluppi.
Prova una vita prima di viverla.`;

  if(navigator.share){
    try{
      await navigator.share({
        title:"E SE?",
        text,
        url:location.href
      });
    }catch(e){}
  }else if(navigator.clipboard){
    await navigator.clipboard.writeText(text+" "+location.href);
    alert("Testo copiato negli appunti.");
  }else{
    alert(text);
  }
}
