function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function toast(message){
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(()=>{
        el.classList.remove("show");
    },2600);
}

function formatDate(date){
    return new Intl.DateTimeFormat("it-IT",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
    }).format(date);
}

function safeInt(value, fallback=0){
    const n = parseInt(value,10);
    return Number.isFinite(n) ? n : fallback;
}

function pick(arr, index){
    if(!arr || !arr.length) return "";
    return arr[Math.abs(index) % arr.length];
}

function hashString(str){
    let hash = 0;

    for(let i=0;i<str.length;i++){
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
    }

    return Math.abs(hash);
}

function getSeed(data){
    return hashString(JSON.stringify(data));
}

function clamp(n,min,max){
    return Math.max(min,Math.min(max,n));
}

========================================================== */

function loadSaved(){
    try{
        const raw = localStorage.getItem(STORAGE_KEY);
        state.saved = raw ? JSON.parse(raw) : [];
        if(!Array.isArray(state.saved)) state.saved = [];
    }catch(e){
        state.saved = [];
    }
}

function persistSaved(){
    try{
        localStorage.setItem(STORAGE_KEY,JSON.stringify(state.saved));
    }catch(e){
        toast("Impossibile salvare questa esperienza.");
    }
}

function saveExperience(data){
    const item = {
        id:uid(),
        createdAt:new Date().toISOString(),
        ...data
    };

    state.saved.unshift(item);

    if(state.saved.length > MAX_SAVED){
        state.saved = state.saved.slice(0,MAX_SAVED);
    }

    persistSaved();
    return item;
}

function deleteSaved(id){
    state.saved = state.saved.filter(x=>x.id!==id);
    persistSaved();
    showSaved();
    toast("Esperienza eliminata.");
}

/* ==========================================================
   MOTORE NARRATIVO
========================================================== */

function getAnswer(id){
    const item = state.answers.find(a=>a.id===id);
    return item ? item.value : "";
}

function calculateProfileScore(profile,answers){

    let score = 50;

    const text = JSON.stringify(profile) + JSON.stringify(answers);
    const seed = getSeed(text);

    score += (seed % 21) - 10;

    const risk = getAnswer("risk");

    if(risk === "Molto") score += 10;
    if(risk === "Abbastanza") score += 5;
    if(risk === "Quasi per niente") score -= 7;

    const control = profile.control;

    if(control === "3") score += 7;
    if(control === "1") score -= 5;

    return clamp(score,20,85);
}

function determineTheme(profile,answers){

    const text = (
        profile.situation + " " +
        profile.work + " " +
        getAnswer("decision") + " " +
        getAnswer("future")
    ).toLowerCase();

    if(/lavor|carriera|studio|univers|azienda|soldi|econom/.test(text)){
        return "lavoro";
    }

    if(/amore|relaz|fidanz|spos|coppia|persona|partner/.test(text)){
        return "relazioni";
    }

    if(/cambiare|trasfer|casa|viagg|partire|nuov/.test(text)){
        return "cambiamento";
    }

    return "vita";
}

            "Tra il primo e il terzo anno nasce un'opportunità collegata a qualcosa che oggi non consideri ancora centrale.";

            "La terza via cresce attraverso compromessi, incontri e decisioni più piccole ma ripetute.";

        opportunity =
            "La possibilità più interessante nasce proprio da ciò che oggi consideri un dettaglio.";

        difficulty =
            "Il rischio è cercare di controllare contemporaneamente due direzioni diverse.";

        turning =
            score < 50
            ? "Un imprevisto obbliga a cambiare programma, ma proprio questo impedimento crea una nuova alternativa."
            : "Un incontro o un'opportunità inattesa fa emergere una possibilità che non avevi considerato.";

        ending =
            "Dopo cinque anni la tua storia è diversa da entrambe le alternative iniziali. Non perché una scelta sia stata perfetta, ma perché alcune possibilità nascono solo quando smetti di pensare in termini di due sole strade.";
    }

    const timelines = [
        {
            year:"Tra 1 anno",
            text:first
        },
        {
            year:"Tra 3 anni",
            text:second
        },
        {
            year:"Tra 5 anni",
            text:ending
        }
    ];

    const eventIndex = Math.abs(seed)%5;

    const events = [
        "Un incontro inatteso modifica una decisione che sembrava già presa.",
        "Un'opportunità arriva in un momento poco comodo.",
        "Una difficoltà esterna costringe a cambiare strategia.",
        "Una persona importante esprime qualcosa che non avevi previsto.",
        "Un progetto che sembrava secondario diventa improvvisamente importante."
    ];

    return {
        type,
        title:names[type],
        intro,
        first,
        second,
        third,
        opportunity,
        difficulty,
        turning,
        ending,
        event:events[eventIndex],
        timelines
    };
}

function generateSoloResult(){

    if(!state.profile || !state.answers.length){
        startSolo();
        return;
    }

    const seed = getSeed({
        profile:state.profile,
        answers:state.answers
    });

    const scenarios = [
        buildScenario(state.profile,state.answers,"choice",seed),
        buildScenario(state.profile,state.answers,"nochoice",seed+17),
        buildScenario(state.profile,state.answers,"third",seed+41)
    ];

    state.generated = {
        mode:"solo",
        createdAt:new Date().toISOString(),
        profile:{...state.profile},
        answers:[...state.answers],
        scenarios
    };

    state.screen = "solo-result";
    render();
    window.scrollTo({top:0,behavior:"smooth"});
}

function saveCurrentExperience(){

    if(!state.generated){
        toast("Nessuna esperienza da salvare.");
        return;
    }

    const existing = state.saved.find(
        x=>x.sourceCreatedAt === state.generated.createdAt
    );

    if(existing){
        toast("Questa esperienza è già salvata.");
        showSaved();
        return;
    }

    const saved = saveExperience({
        mode:state.generated.mode,
        title:
            state.generated.profile?.name
            ? `E SE? — ${state.generated.profile.name}`
            : "E SE?",
        sourceCreatedAt:state.generated.createdAt,
        data:state.generated
    });

    toast("Esperienza salvata.");
    state.saved = state.saved;
    render();
}

    const situation =
        document.getElementById("coupleSituation").value.trim();

    const sharedControl =
        document.querySelector('input[name="sharedControl"]:checked');

    if(
        !profileA.name ||
        !profileA.age ||
        !profileA.sign ||
        !profileA.status ||
        !profileB.name ||
        !profileB.age ||
        !profileB.sign ||
        !profileB.status ||
        !situation ||
        !sharedControl
    ){
        toast("Completa i dati essenziali di entrambe le persone.");
        return;

    state.profileA = profileA;
    state.profileB = profileB;

    state.coupleData = {
        situation,

    state.coupleQuestions = buildCoupleQuestions(
        profileA,

function generateNow(){

    const situation =
        document.getElementById("nowSituation").value.trim();

    const impulse =
        document.querySelector('input[name="nowImpulse"]:checked');

    const tone =
        document.querySelector('input[name="nowTone"]:checked');

    if(!situation || !impulse || !tone){
        toast("Completa la situazione e le due scelte.");
        return;
    }

    const seed = getSeed({
        situation,
        impulse:impulse.value,
        tone:tone.value
    });

    state.nowResult = {
        situation,
        impulse:impulse.value,
        tone:tone.value,
        seed,
        paths:buildNowPaths(situation,impulse.value,tone.value,seed)
    };

    state.screen = "now-result";
    render();
    window.scrollTo({top:0,behavior:"smooth"});
}

        agisci:"Se agisci",

        lasci:"Se lasci andare",

            + "Fai una mossa concreta e questo costringe anche ciò che ti "
            + "circonda a reagire.",
        aspetti:
            "Non fai subito la prima mossa. Osservi, raccogli informazioni "
            + "e lasci che alcune reazioni arrivino spontaneamente.",
        lasci:
            "Decidi di smettere di alimentare la situazione. All'inizio "
            + "può sembrare di perdere qualcosa, ma recuperi spazio mentale.",
        imprevisto:
            "Non segui il percorso che avevi immaginato. Un dettaglio "
            + "apparentemente secondario diventa il punto di partenza."
    };

    const reactions = {
        agisci:
            "La prima conseguenza è una reazione. Può essere positiva, "
            + "negativa o semplicemente più chiara di quanto ti aspettassi.",
        aspetti:
            "Il tempo rivela un elemento che prima non vedevi. "
            + "Aspettare non risolve automaticamente la situazione, "
            + "ma modifica ciò che sai.",
        lasci:
            "Quando smetti di inseguire, cambia il rapporto che hai "
            + "con quella situazione. Qualcosa potrebbe tornare, "
            + "oppure potrebbe finalmente perdere importanza.",
        imprevisto:
            "Una circostanza esterna rompe lo schema iniziale e apre "
            + "una possibilità che non avevi considerato."
    };

    const endings = {
        agisci:
            "La situazione prende una direzione più definita. "
            + "Non necessariamente quella che speravi, ma finalmente "
            + "hai informazioni reali su cosa succede quando fai il primo passo.",
        aspetti:
            "Dopo un po' di tempo diventa più facile distinguere "
            + "ciò che dipende da te da ciò che non dipende da te.",
        lasci:
            "Il risultato più importante potrebbe non essere ciò che "
            + "ottieni, ma ciò che smetti di perdere.",
        imprevisto:
            "La soluzione arriva da una direzione che inizialmente "
            + "non consideravi."
    };

    const messages = {
        leggero:
            "La leggerezza evita che ogni passaggio diventi un giudizio definitivo.",
        sincero:
            "La sincerità rende più evidente cosa vuoi davvero.",
        diretto:
            "La chiarezza riduce gli equivoci, anche quando la risposta non è quella desiderata."
    };

    return Object.keys(names).map((key,index)=>({

        title:names[key],

        intro:opening[key],

        oneYear:
            reactions[key] + " " +
            messages[tone],

        threeYears:

            + "Una decisione successiva nasce da quello che è successo "
            + "nei mesi precedenti.",

                "Un imprevisto cambia le priorità.",
                "Scopri un'informazione che modifica la tua prospettiva.",
                "Una decisione esterna accelera i tempi."
            ],seed+index*13),

        message:messages[tone]

    }));
}

function openSaved(id){

    const item = state.saved.find(x=>x.id===id);

    if(!item){
        toast("Esperienza non trovata.");
        return;
    }

    if(item.mode === "solo"){
        state.generated = item.data;
        state.screen = "solo-result";
    }

    if(item.mode === "couple"){
        state.generated = item.data;
        state.screen = "couple-result";
    }

    if(item.mode === "now"){
        state.nowResult = item.data;
        state.screen = "now-result";
    }

    render();
    window.scrollTo({top:0,behavior:"smooth"});
}

            <br>

            <p>
                Un'eventuale somiglianza tra uno scenario e un evento
                reale è casuale o dipende dalle informazioni fornite
                dall'utente.
            </p>
        `;
    }

    document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
    document.getElementById("modal").classList.add("hidden");
}

/* ==========================================================
   RENDER PRINCIPALE
========================================================== */

function render(){

    const app = document.getElementById("app");

    switch(state.screen){

        case "home":
            app.innerHTML = renderHome();
            break;

        case "solo-profile":
            app.innerHTML = renderSoloProfile();
            break;

        case "questions":
            app.innerHTML = renderQuestions();
            break;

        case "solo-result":
            app.innerHTML = renderSoloResult();
            break;

        case "reality-form":
            app.innerHTML = renderRealityForm();
            break;

        case "reality-result":
            app.innerHTML = renderRealityResult();
            break;

        case "couple-profile":
            app.innerHTML = renderCoupleProfile();
            break;

        case "couple-questions":
            app.innerHTML = renderCoupleQuestions();
            break;

        case "couple-result":
            app.innerHTML = renderCoupleResult();
            break;

        case "now-form":
            app.innerHTML = renderNowForm();
            break;

        case "now-result":
            app.innerHTML = renderNowResult();
            break;

        case "saved":
            app.innerHTML = renderSaved();
            break;

        default:
            state.screen = "home";
            app.innerHTML = renderHome();
    }

    /*
      Gli annunci vengono lasciati esclusivamente nelle sezioni
      predisposte. Non vengono creati automaticamente durante
      le domande o vicino ai controlli di risposta.

      Per le unità pubblicitarie reali, il markup <ins> va generato
      utilizzando lo specifico codice fornito da AdSense per l'unità.
    */
}

/* ==========================================================
   PROTEZIONI
========================================================== */

window.addEventListener("beforeunload",function(){
    /*
      Nessuna azione invasiva.
      Le esperienze vengono salvate solo quando l'utente
      preme esplicitamente "Salva".
    */
});

document.addEventListener("keydown",function(event){

    if(event.key === "Escape"){
        closeModal();
    }
});

document.getElementById("modal").addEventListener("click",function(e){

    if(e.target === this){
        closeModal();
    }
});

/* ==========================================================
   AVVIO
========================================================== */

render();

</script>

</body>
</html>
